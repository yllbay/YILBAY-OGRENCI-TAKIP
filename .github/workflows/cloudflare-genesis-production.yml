name: Cloudflare GENESIS Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory veya deploy"
        required: true
        default: "inventory"
        type: choice
        options:
          - inventory
          - deploy
      confirm:
        description: "Deploy için DEPLOY_GENESIS_WEB_0152 yazın"
        required: false
        default: ""

permissions:
  contents: read

env:
  CF_SCRIPT_NAME: genesis-web-0152
  CF_API_BASE: https://api.cloudflare.com/client/v4

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret eksik"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret eksik"; exit 11; }

      - name: Read current Worker inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p cloudflare/_inventory
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME" \
            -H "$AUTH" -o cloudflare/_inventory/script.json

          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/settings" \
            -H "$AUTH" -o cloudflare/_inventory/settings.json

          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/deployments" \
            -H "$AUTH" -o cloudflare/_inventory/deployments.json

          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/content/v2" \
            -H "$AUTH" -o cloudflare/_inventory/worker-content.bin

          sha256sum cloudflare/_inventory/worker-content.bin \
            | awk '{print $1}' > cloudflare/_inventory/worker-content.sha256

      - name: Produce safe inventory summary
        run: |
          set -euo pipefail
          jq '{
            success,
            result: {
              id: .result.id,
              created_on: .result.created_on,
              modified_on: .result.modified_on,
              compatibility_date: .result.compatibility_date,
              compatibility_flags: .result.compatibility_flags,
              usage_model: .result.usage_model,
              etag: .result.etag
            }
          }' cloudflare/_inventory/script.json > cloudflare/_inventory/script.safe.json

          jq '{
            success,
            result: {
              compatibility_date: .result.compatibility_date,
              compatibility_flags: .result.compatibility_flags,
              main_module: .result.main_module,
              usage_model: .result.usage_model,
              placement: .result.placement,
              limits: .result.limits,
              observability: .result.observability,
              migration_tag: .result.migration_tag,
              bindings: [
                .result.bindings[]? |
                {
                  name,
                  type,
                  class_name,
                  service,
                  environment,
                  bucket_name,
                  database_name,
                  namespace_id
                }
              ]
            }
          }' cloudflare/_inventory/settings.json > cloudflare/_inventory/settings.safe.json

          jq '{
            success,
            deployments: [
              .result.deployments[]? |
              {
                id,
                created_on,
                source,
                strategy,
                versions
              }
            ]
          }' cloudflare/_inventory/deployments.json > cloudflare/_inventory/deployments.safe.json

          echo "### Cloudflare production inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $CF_SCRIPT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker content SHA256: $(cat cloudflare/_inventory/worker-content.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat cloudflare/_inventory/settings.safe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-inventory
          path: |
            cloudflare/_inventory/script.safe.json
            cloudflare/_inventory/settings.safe.json
            cloudflare/_inventory/deployments.safe.json
            cloudflare/_inventory/worker-content.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ inputs.mode == 'deploy' }}
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Hard production guard
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DEPLOY_GENESIS_WEB_0152" || {
            echo "::error::Production deploy onayı yanlış veya eksik."
            exit 20
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: GENESIS curriculum tests
        run: |
          set -euo pipefail
          node --check source/current/app/curriculum-store.js
          node --check source/current/app/server.js
          node --check source/current/app/public/curriculum-step1.js
          node source/current/app/curriculum-store.test.js

      - name: Require reviewed Wrangler production config
        run: |
          set -euo pipefail
          test -f cloudflare/wrangler.production.jsonc || {
            echo "::error::cloudflare/wrangler.production.jsonc yok. Inventory sonucu eşleştirilmeden deploy engellendi."
            exit 21
          }
          test -f cloudflare/Dockerfile || {
            echo "::error::cloudflare/Dockerfile yok. Mevcut container image/build kaynağı eşleştirilmeden deploy engellendi."
            exit 22
          }

      - name: Deploy genesis-web-0152
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.production.jsonc

      - name: Smoke test public gateway
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev/"
          code=$(curl -sS -L -o /tmp/genesis.html -w '%{http_code}' "$URL")
          test "$code" = "200" || { echo "::error::Root HTTP $code"; exit 30; }
          grep -qi "GENESIS" /tmp/genesis.html || { echo "::error::GENESIS login shell bulunamadı"; exit 31; }
          echo "Smoke test OK: $URL"
