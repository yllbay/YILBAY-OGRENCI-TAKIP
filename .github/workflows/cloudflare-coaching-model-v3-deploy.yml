name: GENESIS Coaching Model V3 Deploy

on:
  push:
    branches: [cloudflare-release]
    paths:
      - "cloudflare/coaching-model-v3-trigger.txt"

concurrency:
  group: genesis-web-0152-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_CONTAINER_APP_ID: a03b84d1-3560-43de-8d60-55bbca682961
  CF_PATCH_BASE_IMAGE: registry.cloudflare.com/25fb323918fd4c2d4794fe7a98da6800/genesis-web-0152-genesiscontainer:26942052

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare package and hydrate live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          rm -rf cloudflare/package-runtime
          mkdir -p cloudflare/package-runtime /tmp/genesis-v3
          cat cloudflare/package-bundle.part1.b64 cloudflare/package-bundle.part2.b64 | base64 -d | tar -xJ -C cloudflare/package-runtime
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/genesis-web-0152/content/v2" -H "$AUTH" -o /tmp/genesis-v3/worker-content.bin
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/genesis-v3/worker-content.bin').read_bytes()
          boundary=raw.splitlines()[0].strip()
          candidates=[]
          for part in raw.split(boundary)[1:]:
              part=part.strip(b'\r\n-')
              if not part: continue
              sep=b'\r\n\r\n' if b'\r\n\r\n' in part else b'\n\n'
              if sep not in part: continue
              _,payload=part.split(sep,1)
              payload=payload.rstrip(b'\r\n')
              if b'GenesisContainer' in payload and b'GENESIS_CONTAINER' in payload and b'container.fetch' in payload:
                  candidates.append(payload)
          if len(candidates)!=1:
              raise SystemExit(f'Expected one Worker module, found {len(candidates)}')
          Path('cloudflare/package-runtime/index.js').write_bytes(candidates[0])
          PY
          npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-v3/container-before.json
          echo "PREVIOUS_CONTAINER_VERSION=$(jq -r '.version // 0' /tmp/genesis-v3/container-before.json)" >> "$GITHUB_ENV"
          cp cloudflare/coaching_model_v3.py cloudflare/package-runtime/coaching_model_v3.py
          cp cloudflare/coaching_model_v3_install.py cloudflare/package-runtime/coaching_model_v3_install.py
          cat > cloudflare/package-runtime/Dockerfile <<EOF
          # syntax=docker/dockerfile:1
          FROM $CF_PATCH_BASE_IMAGE
          RUN --mount=type=bind,source=coaching_model_v3.py,target=/tmp/coaching_model_v3.py,ro \
              --mount=type=bind,source=coaching_model_v3_install.py,target=/tmp/coaching_model_v3_install.py,ro \
              cp /tmp/coaching_model_v3.py /app/APP/backend/coaching_model_v3.py && \
              python /tmp/coaching_model_v3_install.py && \
              python -m py_compile /app/APP/backend/coaching_model_v3.py /app/APP/backend/app.py /app/APP/backend/coaching_v2.py /app/APP/backend/curriculum_step1.py
          EOF

      - name: Validate package
        working-directory: cloudflare/package-runtime
        run: |
          set -euo pipefail
          python -m py_compile coaching_model_v3.py coaching_model_v3_install.py
          node --check index.js
          grep -q 'GENESIS_HOME_DASHBOARD_EDGE_V1' index.js
          grep -q 'GENESIS_COACHING_DASHBOARD_EDGE_V1' index.js
          grep -q 'coach3_classes' coaching_model_v3.py
          grep -q '/api/coaching/v3/students/{sid}/homework/auto' coaching_model_v3.py
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/genesis-v3-dry --containers-rollout=none --keep-vars

      - name: Login Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          curl -fsS -X POST "$CF_API_BASE/accounts/$ACCOUNT_ID/containers/registries/registry.cloudflare.com/credentials" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"expiration_minutes":10,"permissions":["pull","push"]}' -o /tmp/genesis-v3/creds.json
          USER="$(jq -r '.result.username // empty' /tmp/genesis-v3/creds.json)"
          PASS="$(jq -r '.result.password // empty' /tmp/genesis-v3/creds.json)"
          test -n "$USER" && test -n "$PASS"
          printf '%s' "$PASS" | docker login registry.cloudflare.com -u "$USER" --password-stdin >/dev/null

      - name: Prebuild and verify model integration
        run: |
          set -euo pipefail
          docker build -t genesis-coaching-v3 -f cloudflare/package-runtime/Dockerfile cloudflare/package-runtime
          CID="$(docker create genesis-coaching-v3)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/APP/backend/app.py" /tmp/genesis-v3/app.py
          docker cp "$CID:/app/APP/backend/coaching_model_v3.py" /tmp/genesis-v3/coaching_model_v3.py
          grep -q 'GENESIS_COACHING_MODEL_V3_INSTALL' /tmp/genesis-v3/app.py
          grep -q 'install_coaching_model_v3(app)' /tmp/genesis-v3/app.py
          grep -q 'coach3_homework_assignments' /tmp/genesis-v3/coaching_model_v3.py
          docker rm -f "$CID" >/dev/null
          trap - EXIT

      - name: Disposable model integration test
        run: |
          set -euo pipefail
          cat > /tmp/genesis-v3/model_test.py <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'/app/APP/backend')
          import db
          from db import connect
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          import coaching_model_v3 as m
          root=Path(tempfile.mkdtemp(prefix='genesis-v3-'))
          tok=db.CURRENT_DB.set(root/'genesis.db')
          try:
              with connect() as con:
                  con.executescript("""
                  CREATE TABLE coaching_students(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,number TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_courses(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_units(id INTEGER PRIMARY KEY AUTOINCREMENT,course_id INTEGER NOT NULL,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_topics(id INTEGER PRIMARY KEY AUTOINCREMENT,unit_id INTEGER NOT NULL,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE exams(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL);
                  CREATE TABLE coach2_settings(student_id INTEGER PRIMARY KEY,day_minutes_json TEXT NOT NULL,max_sessions INTEGER NOT NULL);
                  """)
                  con.execute("INSERT INTO coaching_curriculum_courses(name,name_key,sort_order) VALUES('Matematik','matematik',1)")
                  cid=con.execute("SELECT id FROM coaching_curriculum_courses").fetchone()['id']
                  con.execute("INSERT INTO coaching_curriculum_units(course_id,name,name_key,sort_order) VALUES(?,?,?,1)",(cid,'Fonksiyonlar','fonksiyonlar'))
                  uid=con.execute("SELECT id FROM coaching_curriculum_units").fetchone()['id']
                  con.execute("INSERT INTO coaching_curriculum_topics(unit_id,name,name_key,sort_order) VALUES(?,?,?,1)",(uid,'Fonksiyon Kavramı','fonksiyon kavramı'))
                  tid=con.execute("SELECT id FROM coaching_curriculum_topics").fetchone()['id']
              app=FastAPI()
              @app.middleware('http')
              async def auth(request,call_next):
                  request.state.genesis_session={'role':'ADMIN'}
                  return await call_next(request)
              m.install_coaching_model_v3(app)
              c=TestClient(app)
              rc=c.post('/api/coaching/v3/classes',json={'name':'12-A','grade_label':'12. Sınıf','difficulty_level':'MEDIUM','note':''}); assert rc.status_code==200,rc.text
              class_id=rc.json()['id']
              rs=c.post('/api/coaching/v3/students',json={'name':'Test Öğrenci','number':'V3-TEST','class_id':class_id}); assert rs.status_code==200,rs.text
              sid=rs.json()['student']['id']
              assert c.put(f'/api/coaching/v3/CLASS/{class_id}/courses',json={'curriculum_course_id':cid,'weekly_sessions':2,'minutes':45,'daily_exam':True,'active':True}).status_code==200
              assert c.put(f'/api/coaching/v3/CLASS/{class_id}/responsibilities',json={'curriculum_course_id':cid,'selections':[{'unit_id':uid,'topic_id':tid}]}).status_code==200
              for i in range(2):
                  rr=c.post('/api/coaching/v3/resources/link',json={'curriculum_course_id':cid,'unit_id':uid,'topic_id':tid,'title':f'Video {i}','kind':'VIDEO','difficulty':'MEDIUM','estimated_minutes':45,'url':f'https://example.com/{i}'}); assert rr.status_code==200,rr.text
              ra=c.post(f'/api/coaching/v3/students/{sid}/homework/auto',json={'week_start':'2026-09-21','replace_unfinished':False}); assert ra.status_code==200,ra.text
              assert len(ra.json()['assignments'])==2
              rm=c.get(f'/api/coaching/v3/students/{sid}/model?week_start=2026-09-21'); assert rm.status_code==200,rm.text
              assert rm.json()['effective_level']=='MEDIUM'
              assert len(rm.json()['courses'])==1 and len(rm.json()['responsibilities'])==1 and len(rm.json()['homework'])==2
              print('DISPOSABLE_COACHING_MODEL_V3_OK')
          finally:
              db.CURRENT_DB.reset(tok)
          PY
          docker run --rm --entrypoint python -v /tmp/genesis-v3/model_test.py:/tmp/model_test.py:ro genesis-coaching-v3 /tmp/model_test.py

      - name: Deploy tested package
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/package-runtime
          command: deploy --keep-vars --containers-rollout=immediate

      - name: Wait for clean rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          READY=0
          for i in $(seq 1 72); do
            npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-v3/container-after.json
            VERSION="$(jq -r '.version // 0' /tmp/genesis-v3/container-after.json)"
            FAILED="$(jq -r '.health.instances.failed // 0' /tmp/genesis-v3/container-after.json)"
            ERRORS="$(jq -r '.health.errors | length' /tmp/genesis-v3/container-after.json)"
            if [ "$VERSION" -gt "$PREVIOUS_CONTAINER_VERSION" ] && [ "$FAILED" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
              READY=1
              echo "Container rollout accepted: version $VERSION"
              break
            fi
            curl -sS -L --max-time 8 "$URL/" -o /tmp/genesis-v3/warmup.html || true
            sleep 5
          done
          test "$READY" = "1" || { cat /tmp/genesis-v3/container-after.json; exit 29; }
          test "$(jq -r '.observability.logs.enabled // false' /tmp/genesis-v3/container-after.json)" = "true"

      - name: Production smoke
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          ROOT="$(curl -sS -L -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/root.html -w '%{http_code}' "$URL/" || true)"
          test "$ROOT" = "200"
          grep -q 'GENESIS_HOME_DASHBOARD_EDGE_V1' /tmp/root.html
          COACH="$(curl -sS -L -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/coaching.html -w '%{http_code}' "$URL/coaching" || true)"
          test "$COACH" = "200"
          grep -q 'GENESIS_COACHING_DASHBOARD_EDGE_V1' /tmp/coaching.html
          CLASSES="$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/classes.json -w '%{http_code}' "$URL/api/coaching/v3/classes" || true)"
          test "$CLASSES" = "200"
          jq -e '.classes|type=="array"' /tmp/classes.json >/dev/null
          CURR="$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/curr.json -w '%{http_code}' "$URL/api/coaching/v3/curriculum" || true)"
          test "$CURR" = "200"
          jq -e '.courses|type=="array"' /tmp/curr.json >/dev/null
          STUD="$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/students.json -w '%{http_code}' "$URL/api/coaching/v2/students" || true)"
          test "$STUD" = "200"
          SID="$(jq -r '.students[0].id // empty' /tmp/students.json)"
          if [ -n "$SID" ]; then
            OLD="$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/old-dashboard.json -w '%{http_code}' "$URL/api/coaching/v2/students/$SID/dashboard?week_start=2026-09-21" || true)"
            test "$OLD" = "200"
            MODEL="$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/model.json -w '%{http_code}' "$URL/api/coaching/v3/students/$SID/model?week_start=2026-09-21" || true)"
            test "$MODEL" = "200"
          fi
          INVALID="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' "$URL/api/online/internet-test/genesis-audit-invalid-token" || true)"
          test "$INVALID" = "404"
          echo "GENESIS_COACHING_MODEL_V3_PRODUCTION_SMOKE_OK"
