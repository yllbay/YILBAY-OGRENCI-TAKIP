name: GENESIS Coaching Model V3 Deploy

on:
  push:
    branches: [cloudflare-release]
    paths:
      - "cloudflare/coaching-model-v3-trigger.txt"

concurrency:
  group: genesis-web-0152-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_CONTAINER_APP_ID: a03b84d1-3560-43de-8d60-55bbca682961
  CF_SCRIPT_NAME: genesis-web-0152

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install OCI tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo umoci

      - name: Hydrate exact live Worker and current container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -rf cloudflare/package-runtime /tmp/genesis-v3
          mkdir -p cloudflare/package-runtime /tmp/genesis-v3
          cat cloudflare/package-bundle.part1.b64 cloudflare/package-bundle.part2.b64 | base64 -d | tar -xJ -C cloudflare/package-runtime
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/content/v2" -H "$AUTH" -o /tmp/genesis-v3/worker-content.bin
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/genesis-v3/worker-content.bin').read_bytes()
          boundary=raw.splitlines()[0].strip()
          candidates=[]
          for part in raw.split(boundary)[1:]:
              part=part.strip(b'\r\n-')
              if not part: continue
              sep=b'\r\n\r\n' if b'\r\n\r\n' in part else b'\n\n'
              if sep not in part: continue
              _,payload=part.split(sep,1)
              payload=payload.rstrip(b'\r\n')
              if b'GenesisContainer' in payload and b'GENESIS_CONTAINER' in payload and b'container.fetch' in payload:
                  candidates.append(payload)
          if len(candidates)!=1:
              raise SystemExit(f'Expected one Worker module, found {len(candidates)}')
          Path('cloudflare/package-runtime/index.js').write_bytes(candidates[0])
          PY
          node --check cloudflare/package-runtime/index.js
          grep -q 'GENESIS_HOME_DASHBOARD_EDGE_V1' cloudflare/package-runtime/index.js
          grep -q 'GENESIS_COACHING_DASHBOARD_EDGE_V4' cloudflare/package-runtime/index.js
          npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-v3/container-before.json
          PREVIOUS_IMAGE="$(jq -r '.configuration.image // empty' /tmp/genesis-v3/container-before.json)"
          PREVIOUS_VERSION="$(jq -r '.version // 0' /tmp/genesis-v3/container-before.json)"
          test -n "$PREVIOUS_IMAGE"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"

      - name: Pull current image through OCI API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X POST "$CF_API_BASE/accounts/$ACCOUNT_ID/containers/registries/registry.cloudflare.com/credentials" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data '{"expiration_minutes":20,"permissions":["pull","push"]}' -o /tmp/genesis-v3/registry.json
          REG_USER="$(jq -r '.result.username // empty' /tmp/genesis-v3/registry.json)"
          REG_PASS="$(jq -r '.result.password // empty' /tmp/genesis-v3/registry.json)"
          test -n "$REG_USER" && test -n "$REG_PASS"
          echo "::add-mask::$REG_USER"; echo "::add-mask::$REG_PASS"
          echo "REG_USER=$REG_USER" >> "$GITHUB_ENV"
          echo "REG_PASS=$REG_PASS" >> "$GITHUB_ENV"
          skopeo inspect --config --creds "$REG_USER:$REG_PASS" "docker://$PREVIOUS_IMAGE" > /tmp/genesis-v3/source-config.json
          skopeo copy --src-creds "$REG_USER:$REG_PASS" "docker://$PREVIOUS_IMAGE" oci:/tmp/genesis-v3/current-oci:live
          umoci unpack --rootless --image /tmp/genesis-v3/current-oci:live /tmp/genesis-v3/bundle
          ROOT=/tmp/genesis-v3/bundle/rootfs
          test -f "$ROOT/app/APP/backend/app.py"
          test -f "$ROOT/app/APP/backend/coaching_v2.py"
          test -f "$ROOT/app/APP/backend/curriculum_step1.py"
          test -f "$ROOT/app/start-container.sh"

      - name: Patch and compile canonical V3 model
        run: |
          set -euo pipefail
          ROOT=/tmp/genesis-v3/bundle/rootfs/app/APP
          mkdir -p "$ROOT/backend/_vendor"
          python3 -m pip install --quiet --disable-pip-version-check --target "$ROOT/backend/_vendor" "boto3>=1.34,<2"
          cp cloudflare/r2_object_store.py "$ROOT/backend/r2_object_store.py"
          cp cloudflare/coaching_model_v3.py "$ROOT/backend/coaching_model_v3.py"
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_db_persistence_v2_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_db_persistence_v3_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_bbox_fix_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_r2_images_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/coaching_model_v3_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_pool_guard_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_hard_lock_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_immutable_guard_v2_install.py
          GENESIS_APP_ROOT="$ROOT" python3 cloudflare/question_studio_delete_upgrade.py
          python3 -m py_compile "$ROOT/backend/r2_object_store.py" "$ROOT/backend/db.py" "$ROOT/backend/coaching_model_v3.py" "$ROOT/backend/app.py" "$ROOT/backend/coaching_v2.py" "$ROOT/backend/curriculum_step1.py"
          grep -q 'GENESIS_QUESTION_STUDIO_DB_PERSIST_V2' "$ROOT/backend/db.py"
          grep -q 'GENESIS_QUESTION_STUDIO_DB_PERSIST_V3_BOOTSTRAP' "$ROOT/backend/db.py"
          grep -q 'GENESIS_QUESTION_STUDIO_BBOX_SAVEFIX_V1' "$ROOT/backend/app.py"
          grep -q 'GENESIS_QUESTION_STUDIO_R2_IMAGES_V1' "$ROOT/backend/app.py"
          grep -q 'GENESIS_QUESTION_STUDIO_HARD_LOCK_V1' "$ROOT/backend/app.py"
          grep -q 'GENESIS_QUESTION_STUDIO_HARD_LOCK_V1' "$ROOT/backend/db.py"
          grep -q 'GENESIS_QUESTION_STUDIO_IMMUTABLE_GUARD_V2' "$ROOT/backend/app.py"
          grep -q 'GENESIS_QUESTION_STUDIO_IMMUTABLE_GUARD_V2' "$ROOT/backend/db.py"
          grep -q '/api/internal/question-studio-fingerprint' "$ROOT/backend/app.py"
          grep -q 'GENESIS_COACHING_MODEL_V3_INSTALL' "$ROOT/backend/app.py"
          grep -q 'install_coaching_model_v3(app)' "$ROOT/backend/app.py"
          grep -q 'GENESIS_QUESTION_POOL_GUARD_V1' "$ROOT/backend/app.py"
          grep -q 'GENESIS_STARTUP_STORAGE_MAINTENANCE' "$ROOT/backend/app.py"
          grep -q '"deletion_complete"' "$ROOT/backend/app.py"
          grep -q '/api/coaching/v3/students/{sid}/homework/auto' "$ROOT/backend/coaching_model_v3.py"
          grep -q 'coach3_homework_assignments' "$ROOT/backend/coaching_model_v3.py"

      - name: Build Cloudflare-safe app-layer image
        run: |
          set -euo pipefail
          NEW_IMAGE="registry.cloudflare.com/$ACCOUNT_ID/genesis-web-0152-genesiscontainer:question-studio-repair-${GITHUB_SHA::12}"
          export NEW_IMAGE
          python3 cloudflare/rebuild_v3_image.py
          CID="$(docker create "$NEW_IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/APP/backend/app.py" /tmp/genesis-v3/flat-app.py
          docker cp "$CID:/app/APP/backend/coaching_model_v3.py" /tmp/genesis-v3/flat-model.py
          grep -q 'GENESIS_COACHING_MODEL_V3_INSTALL' /tmp/genesis-v3/flat-app.py
          grep -q 'GENESIS_QUESTION_POOL_GUARD_V1' /tmp/genesis-v3/flat-app.py
          grep -q 'GENESIS_QUESTION_STUDIO_HARD_LOCK_V1' /tmp/genesis-v3/flat-app.py
          grep -q 'GENESIS_QUESTION_STUDIO_IMMUTABLE_GUARD_V2' /tmp/genesis-v3/flat-app.py
          grep -q 'GENESIS_STARTUP_STORAGE_MAINTENANCE' /tmp/genesis-v3/flat-app.py
          grep -q 'VERSION = "0.16.0"' /tmp/genesis-v3/flat-model.py
          docker rm -f "$CID" >/dev/null
          trap - EXIT
          PUSH_OK=0
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REG_PASS" | docker login registry.cloudflare.com -u "$REG_USER" --password-stdin >/dev/null 2>&1 && docker push "$NEW_IMAGE" >/tmp/genesis-v3/push.txt 2>&1; then
              PUSH_OK=1
              break
            fi
            echo "::warning::Registry push attempt $attempt failed; retrying."
            sleep $((attempt * 4))
          done
          test "$PUSH_OK" = "1" || { cat /tmp/genesis-v3/push.txt || true; exit 41; }
          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"

      - name: Disposable V3 data-model integration test
        run: |
          set -euo pipefail
          cat > /tmp/genesis-v3/model_test.py <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'/app/APP/backend')
          import db
          from db import connect
          import coaching_model_v3 as m
          root=Path(tempfile.mkdtemp(prefix='genesis-v3-'))
          tok=db.CURRENT_DB.set(root/'genesis.db')
          try:
              with connect() as con:
                  con.executescript("""
                  CREATE TABLE coaching_students(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,number TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_courses(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_units(id INTEGER PRIMARY KEY AUTOINCREMENT,course_id INTEGER NOT NULL,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE coaching_curriculum_topics(id INTEGER PRIMARY KEY AUTOINCREMENT,unit_id INTEGER NOT NULL,name TEXT NOT NULL,name_key TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 0,is_active INTEGER NOT NULL DEFAULT 1,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);
                  CREATE TABLE exams(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL);
                  CREATE TABLE coach2_settings(student_id INTEGER PRIMARY KEY,day_minutes_json TEXT NOT NULL,max_sessions INTEGER NOT NULL);
                  """)
                  con.execute("INSERT INTO coaching_curriculum_courses(name,name_key,sort_order) VALUES('Matematik','matematik',1)")
                  cid=con.execute("SELECT id FROM coaching_curriculum_courses").fetchone()['id']
                  con.execute("INSERT INTO coaching_curriculum_units(course_id,name,name_key,sort_order) VALUES(?,?,?,1)",(cid,'Fonksiyonlar','fonksiyonlar'))
                  uid=con.execute("SELECT id FROM coaching_curriculum_units").fetchone()['id']
                  con.execute("INSERT INTO coaching_curriculum_topics(unit_id,name,name_key,sort_order) VALUES(?,?,?,1)",(uid,'Fonksiyon Kavramı','fonksiyon kavramı'))
                  tid=con.execute("SELECT id FROM coaching_curriculum_topics").fetchone()['id']
              m.ensure_schema()
              with connect() as con:
                  class_id=int(con.execute("INSERT INTO coach3_classes(name,name_key,grade_label,difficulty_level) VALUES('12-A','12-a','12. Sınıf','MEDIUM')").lastrowid)
                  sid=int(con.execute("INSERT INTO coaching_students(name,number) VALUES('Test Öğrenci','V3-TEST')").lastrowid)
                  con.execute("INSERT INTO coach3_student_class(student_id,class_id) VALUES(?,?)",(sid,class_id))
                  con.execute("INSERT INTO coach3_course_assignments(scope_type,scope_id,curriculum_course_id,weekly_sessions,minutes,daily_exam) VALUES('CLASS',?,?,?,?,1)",(class_id,cid,2,45))
                  con.execute("INSERT INTO coach3_responsibilities(scope_type,scope_id,curriculum_course_id,unit_id,topic_id) VALUES('CLASS',?,?,?,?)",(class_id,cid,uid,tid))
                  for i in range(2):
                      con.execute("INSERT INTO coach3_resources(curriculum_course_id,unit_id,topic_id,title,kind,difficulty,estimated_minutes,source_kind,url) VALUES(?,?,?,?,?,?,?,?,?)",(cid,uid,tid,f'Video {i}','VIDEO','MEDIUM',45,'URL',f'https://example.com/{i}'))
                  result=m._generate_homework(con,sid,'2026-09-21',False)
                  assert result['level']=='MEDIUM'
                  assert len(result['assignments'])==2
                  assert len(m._effective_courses(con,sid))==1
                  assert len(m._effective_responsibilities(con,sid))==1
                  assert len(m._homework_for_week(con,sid,'2026-09-21'))==2
              print('DISPOSABLE_COACHING_MODEL_V3_OK')
          finally:
              db.CURRENT_DB.reset(tok)
          PY
          docker run --rm -e GENESIS_SKIP_R2_SNAPSHOT=1 --entrypoint python -v /tmp/genesis-v3/model_test.py:/tmp/model_test.py:ro "$NEW_IMAGE" /tmp/model_test.py

      - name: Disposable question-pool deletion durability test
        run: |
          set -euo pipefail
          cat > /tmp/genesis-v3/question_pool_guard_test.py <<'PY'
          import json, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'/app/APP/backend')
          import app as a

          root=Path(tempfile.mkdtemp(prefix='genesis-question-pool-'))
          a.DATA=root
          a.RAW=root/'RawCrops'
          a.DISPLAY=root/'DisplayImages'
          a.DELETION_TOMBSTONES=root/'DeletionTombstones'
          a.BACKUPS=root/'Backups'
          a.RAW.mkdir(parents=True,exist_ok=True)
          a.DISPLAY.mkdir(parents=True,exist_ok=True)
          a.DELETION_TOMBSTONES.mkdir(parents=True,exist_ok=True)
          raw_rel='RawCrops/q.png'
          dis_rel='DisplayImages/q.png'
          (root/raw_rel).write_bytes(b'raw')
          (root/dis_rel).write_bytes(b'display')
          tomb=a._write_delete_tombstone(77,raw_rel,dis_rel,'drive-file-77')

          a._purge_question_from_backup_zips=lambda *args,**kwargs:{'checked':0,'changed':0}
          a._purge_question_from_drive_snapshots=lambda *args,**kwargs:{'status':'PENDING','reason':'offline','snapshots_checked':0,'snapshots_changed':0}
          a.drive_delete_file=lambda *args,**kwargs:{'status':'PENDING','reason':'offline'}
          first=a._process_delete_tombstone(tomb)
          assert first['local']['status']=='PURGED'
          assert not (root/raw_rel).exists()
          assert not (root/dis_rel).exists()
          assert tomb.exists(), 'tombstone must survive while Drive deletion is pending'

          a._purge_question_from_drive_snapshots=lambda *args,**kwargs:{'status':'PURGED','snapshots_checked':1,'snapshots_changed':1}
          a.drive_delete_file=lambda *args,**kwargs:{'status':'PURGED','file_id':'drive-file-77'}
          second=a._process_delete_tombstone(tomb)
          assert second['complete'] is True
          assert not tomb.exists(), 'tombstone must clear only after R2 and Drive deletion finish'
          print('QUESTION_POOL_GUARD_DISPOSABLE_OK')
          PY
          docker run --rm -e GENESIS_SKIP_R2_SNAPSHOT=1 --entrypoint python -v /tmp/genesis-v3/question_pool_guard_test.py:/tmp/question_pool_guard_test.py:ro "$NEW_IMAGE" /tmp/question_pool_guard_test.py

      - name: Capture production Question Studio baseline
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          mkdir -p /tmp/genesis-v3

          # Cold-start safe, read-only fetch. Never POST/PUT/PATCH/DELETE here.
          curl -sS -L --connect-timeout 5 --max-time 20 "$URL/" -o /tmp/genesis-v3/qs-warm.html || true

          fetch_json() {
            local path="$1"
            local out="$2"
            local code=""
            for i in 1 2 3 4 5 6; do
              code="$(curl -sS --connect-timeout 5 --max-time 20 -o "$out" -w '%{http_code}' "$URL$path" || true)"
              if [ "$code" = "200" ]; then
                printf '%s' "$code"
                return 0
              fi
              sleep 3
            done
            printf '%s' "$code"
            return 1
          }

          TOPICS_CODE="$(fetch_json /api/topics /tmp/genesis-v3/qs-topics-before.json)"
          TESTS_CODE="$(fetch_json /api/test-tree /tmp/genesis-v3/qs-tests-before.json)"
          test "$TOPICS_CODE" = "200"
          test "$TESTS_CODE" = "200"
          jq -S . /tmp/genesis-v3/qs-topics-before.json > /tmp/genesis-v3/qs-topics-before.canon
          jq -S . /tmp/genesis-v3/qs-tests-before.json > /tmp/genesis-v3/qs-tests-before.canon
          sha256sum /tmp/genesis-v3/qs-topics-before.canon | awk '{print $1}' > /tmp/genesis-v3/qs-topics-before.sha
          sha256sum /tmp/genesis-v3/qs-tests-before.canon | awk '{print $1}' > /tmp/genesis-v3/qs-tests-before.sha

          FP_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/genesis-v3/qs-fingerprint-before.json -w '%{http_code}' "$URL/api/internal/question-studio-fingerprint" || true)"
          if [ "$FP_CODE" = "200" ]; then
            jq -e '.marker=="GENESIS_QUESTION_STUDIO_HARD_LOCK_V1" and (.sha256|type=="string")' /tmp/genesis-v3/qs-fingerprint-before.json >/dev/null
            jq -r '.sha256' /tmp/genesis-v3/qs-fingerprint-before.json > /tmp/genesis-v3/qs-fingerprint-before.sha
            echo "QS_STRICT_BASELINE=1" >> "$GITHUB_ENV"
            echo "Question Studio strict baseline captured."
          else
            echo "QS_STRICT_BASELINE=0" >> "$GITHUB_ENV"
            echo "::warning::First hard-lock rollout: strict DB fingerprint endpoint not yet present; topics/test-tree fallback baseline captured."
          fi

      - name: Disposable Question Studio hard-lock test
        run: |
          set -euo pipefail
          cat > /tmp/genesis-v3/question_studio_hard_lock_test.py <<'PY'
          import sqlite3, tempfile, sys
          from pathlib import Path
          sys.path.insert(0,'/app/APP/backend')
          import db

          root=Path(tempfile.mkdtemp(prefix='genesis-hard-lock-'))
          path=root/'genesis.db'
          raw=sqlite3.connect(path)
          raw.executescript("""
          CREATE TABLE questions(id INTEGER PRIMARY KEY, body TEXT);
          CREATE TABLE topics(id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE exams(id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE test_folders(id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE raw_crops(id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE source_documents(id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE coaching_students(id INTEGER PRIMARY KEY, name TEXT);
          INSERT INTO questions(id,body) VALUES(1,'protected');
          INSERT INTO topics(id,name) VALUES(1,'protected-topic');
          INSERT INTO exams(id,name) VALUES(1,'protected-exam');
          INSERT INTO test_folders(id,name) VALUES(1,'protected-folder');
          INSERT INTO raw_crops(id,name) VALUES(1,'protected-crop');
          INSERT INTO source_documents(id,name) VALUES(1,'protected-source');
          """)
          raw.commit()
          raw.close()

          tok=db.CURRENT_DB.set(path)
          try:
              blocked=0
              for sql in (
                  "UPDATE questions SET body='mutated' WHERE id=1",
                  "DELETE FROM topics WHERE id=1",
                  "INSERT INTO exams(id,name) VALUES(2,'mutated-exam')",
                  "DELETE FROM test_folders WHERE id=1",
                  "UPDATE raw_crops SET name='mutated-crop' WHERE id=1",
                  "DELETE FROM source_documents WHERE id=1",
              ):
                  try:
                      with db.connect() as con:
                          con.execute(sql)
                  except sqlite3.DatabaseError:
                      blocked+=1
              assert blocked==6, f'expected 6 protected writes blocked, got {blocked}'

              with db.connect() as con:
                  con.execute("INSERT INTO coaching_students(id,name) VALUES(1,'allowed-background')")
              with sqlite3.connect(path) as con:
                  assert con.execute("SELECT body FROM questions WHERE id=1").fetchone()[0]=='protected'
                  assert con.execute("SELECT count(*) FROM topics").fetchone()[0]==1
                  assert con.execute("SELECT count(*) FROM exams").fetchone()[0]==1
                  assert con.execute("SELECT count(*) FROM coaching_students").fetchone()[0]==1

              user_tok=db.QUESTION_STUDIO_USER_WRITE.set(True)
              try:
                  with db.connect() as con:
                      con.execute("UPDATE questions SET body='user-change' WHERE id=1")
              finally:
                  db.QUESTION_STUDIO_USER_WRITE.reset(user_tok)
              with sqlite3.connect(path) as con:
                  assert con.execute("SELECT body FROM questions WHERE id=1").fetchone()[0]=='user-change'
              print('QUESTION_STUDIO_HARD_LOCK_DISPOSABLE_OK')
          finally:
              db.CURRENT_DB.reset(tok)
          PY
          docker run --rm -e GENESIS_SKIP_R2_SNAPSHOT=1 --entrypoint python -v /tmp/genesis-v3/question_studio_hard_lock_test.py:/tmp/question_studio_hard_lock_test.py:ro "$NEW_IMAGE" /tmp/question_studio_hard_lock_test.py

      - name: Configure Wrangler to use the pushed registry image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('cloudflare/package-runtime/wrangler.jsonc')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg['containers'][0]['image']=os.environ['NEW_IMAGE']
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          grep -Fq "$NEW_IMAGE" cloudflare/package-runtime/wrangler.jsonc
          node --check cloudflare/package-runtime/index.js
          (cd cloudflare/package-runtime && npx --yes wrangler@4 deploy --dry-run --outdir /tmp/genesis-v3/wrangler-dry --containers-rollout=none --keep-vars)

      - name: Deploy V3 backend and roll out flattened image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd cloudflare/package-runtime && npx --yes wrangler@4 deploy --keep-vars --containers-rollout=immediate)
          echo "DEPLOY_ATTEMPTED=1" >> "$GITHUB_ENV"

      - name: Wait for clean rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          READY=0
          for i in $(seq 1 90); do
            npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-v3/container-after.json
            V="$(jq -r '.version // 0' /tmp/genesis-v3/container-after.json)"
            F="$(jq -r '.health.instances.failed // 0' /tmp/genesis-v3/container-after.json)"
            E="$(jq -r '.health.errors|length' /tmp/genesis-v3/container-after.json)"
            IMG="$(jq -r '.configuration.image // empty' /tmp/genesis-v3/container-after.json)"
            if [ "$V" -gt "$PREVIOUS_VERSION" ] && [ "$IMG" = "$NEW_IMAGE" ] && [ "$F" -eq 0 ] && [ "$E" -eq 0 ]; then
              READY=1; echo "Container V3 rollout accepted: version $V"; break
            fi
            if [ "$V" -gt "$PREVIOUS_VERSION" ] && [ "$IMG" = "$NEW_IMAGE" ] && { [ "$F" -gt 0 ] || [ "$E" -gt 0 ]; }; then
              echo "::error::New V3 image reported rollout failure"
              cat /tmp/genesis-v3/container-after.json
              exit 33
            fi
            curl -sS -L --max-time 8 "$URL/" -o /tmp/genesis-v3/warm.html || true
            sleep 5
          done
          test "$READY" = "1" || { cat /tmp/genesis-v3/container-after.json; exit 32; }
          test "$(jq -r '.observability.logs.enabled // false' /tmp/genesis-v3/container-after.json)" = "true"

      - name: Production read-only smoke
        run: |
          set -euxo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          OK=0
          for i in $(seq 1 20); do
            ROOT="$(curl -sS -L --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/root.html -w '%{http_code}' "$URL/" || true)"
            if [ "$ROOT" = "200" ]; then OK=1; break; fi
            sleep 4
          done
          test "$OK" = "1"
          grep -q 'GENESIS_HOME_DASHBOARD_EDGE_V1' /tmp/genesis-v3/root.html

          ME="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/me.json -w '%{http_code}' "$URL/api/auth/me" || true)"
          test "$ME" = "200"
          jq -e '.authenticated==true and .role=="ADMIN"' /tmp/genesis-v3/me.json >/dev/null

          COACH="$(curl -sS -L --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/coaching.html -w '%{http_code}' "$URL/coaching" || true)"
          test "$COACH" = "200"
          grep -q 'GENESIS_COACHING_DASHBOARD_EDGE_V4' /tmp/genesis-v3/coaching.html

          CLASSES="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/classes.json -w '%{http_code}' "$URL/api/coaching/v3/classes" || true)"
          test "$CLASSES" = "200"
          jq -e '.classes|type=="array"' /tmp/genesis-v3/classes.json >/dev/null

          CURR="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/curr.json -w '%{http_code}' "$URL/api/coaching/v3/curriculum" || true)"
          test "$CURR" = "200"
          jq -e '.courses|type=="array"' /tmp/genesis-v3/curr.json >/dev/null

          STUD="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/students.json -w '%{http_code}' "$URL/api/coaching/v2/students" || true)"
          test "$STUD" = "200"
          SID="$(jq -r '.students[0].id // empty' /tmp/genesis-v3/students.json)"
          if [ -n "$SID" ]; then
            OLD="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/old-dashboard.json -w '%{http_code}' "$URL/api/coaching/v2/students/$SID/dashboard?week_start=2026-09-21" || true)"
            test "$OLD" = "200"
            MODEL="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/model.json -w '%{http_code}' "$URL/api/coaching/v3/students/$SID/model?week_start=2026-09-21" || true)"
            test "$MODEL" = "200"
            jq -e '.student and (.courses|type=="array") and (.responsibilities|type=="array") and (.homework|type=="array")' /tmp/genesis-v3/model.json >/dev/null
          fi

          TOPICS="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/topics.json -w '%{http_code}' "$URL/api/topics" || true)"
          test "$TOPICS" = "200"
          jq -e 'type=="array"' /tmp/genesis-v3/topics.json >/dev/null

          TESTTREE="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/test-tree.json -w '%{http_code}' "$URL/api/test-tree" || true)"
          test "$TESTTREE" = "200"
          jq -e 'type=="array"' /tmp/genesis-v3/test-tree.json >/dev/null

          # Hard-lock integrity gate: deploy/restart/migration must not mutate
          # Question Studio folders, questions, exams, or relationship tables.
          jq -S . /tmp/genesis-v3/topics.json > /tmp/genesis-v3/qs-topics-after.canon
          jq -S . /tmp/genesis-v3/test-tree.json > /tmp/genesis-v3/qs-tests-after.canon
          test "$(sha256sum /tmp/genesis-v3/qs-topics-after.canon | awk '{print $1}')" = "$(cat /tmp/genesis-v3/qs-topics-before.sha)"
          test "$(sha256sum /tmp/genesis-v3/qs-tests-after.canon | awk '{print $1}')" = "$(cat /tmp/genesis-v3/qs-tests-before.sha)"

          QSF="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/qs-fingerprint-after.json -w '%{http_code}' "$URL/api/internal/question-studio-fingerprint" || true)"
          test "$QSF" = "200"
          jq -e '.marker=="GENESIS_QUESTION_STUDIO_HARD_LOCK_V1" and (.sha256|type=="string")' /tmp/genesis-v3/qs-fingerprint-after.json >/dev/null
          if [ "${QS_STRICT_BASELINE:-0}" = "1" ]; then
            test "$(jq -r '.sha256' /tmp/genesis-v3/qs-fingerprint-after.json)" = "$(cat /tmp/genesis-v3/qs-fingerprint-before.sha)"
          fi
          echo "GENESIS_QUESTION_STUDIO_HARD_LOCK_INTEGRITY_OK"

          R2P="$(curl -sS --connect-timeout 5 --max-time 15 -c /tmp/genesis-v3/cookies -b /tmp/genesis-v3/cookies -o /tmp/genesis-v3/r2.json -w '%{http_code}' "$URL/api/internal/r2-question-pool-readonly" || true)"
          test "$R2P" = "200"
          echo "R2_PROBE=$(cat /tmp/genesis-v3/r2.json)"
          jq -e '.genesis_db.exists==true and (.genesis_db.size|tonumber)>0' /tmp/genesis-v3/r2.json >/dev/null
          echo "QUESTION_STUDIO_R2=$(jq -c '{genesis_db,prefix_counts,total_objects_under_DATA}' /tmp/genesis-v3/r2.json)"

          INVALID="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/genesis-v3/invalid.json -w '%{http_code}' "$URL/api/online/internet-test/genesis-audit-invalid-token" || true)"
          test "$INVALID" = "404"
          echo "GENESIS_QUESTION_STUDIO_DURABLE_STORAGE_SMOKE_OK"

      - name: Roll back previous image on failure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_ATTEMPTED:-0}" != "1" ]; then
            echo "Deploy did not start; rollback not needed."
            exit 0
          fi
          echo "::warning::Rolling back to previous container image $PREVIOUS_IMAGE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('cloudflare/package-runtime/wrangler.jsonc')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg['containers'][0]['image']=os.environ['PREVIOUS_IMAGE']
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          (cd cloudflare/package-runtime && npx --yes wrangler@4 deploy --keep-vars --containers-rollout=immediate)
          ROLLBACK_OK=0
          for i in $(seq 1 60); do
            npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-v3/container-rollback.json
            IMG="$(jq -r '.configuration.image // empty' /tmp/genesis-v3/container-rollback.json)"
            F="$(jq -r '.health.instances.failed // 0' /tmp/genesis-v3/container-rollback.json)"
            E="$(jq -r '.health.errors|length' /tmp/genesis-v3/container-rollback.json)"
            if [ "$IMG" = "$PREVIOUS_IMAGE" ] && [ "$F" -eq 0 ] && [ "$E" -eq 0 ]; then
              ROLLBACK_OK=1
              echo "Rollback verified: $PREVIOUS_IMAGE"
              break
            fi
            sleep 5
          done
          test "$ROLLBACK_OK" = "1" || { cat /tmp/genesis-v3/container-rollback.json; exit 51; }
