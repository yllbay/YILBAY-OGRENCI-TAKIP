name: Publish v0.6.2 verified package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v062.yml'
      - '.github/scripts/build_v062.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified v0.6.1 base
        shell: bash
        run: |
          set -euo pipefail
          test -f release/YILBAY_APP_v0.6.1.zip
          rm -rf /tmp/yilbay062
          mkdir -p /tmp/yilbay062/src
          unzip -q release/YILBAY_APP_v0.6.1.zip -d /tmp/yilbay062/src

      - name: Apply Credential Manager patch
        shell: bash
        run: python .github/scripts/build_v062.py

      - name: Validate patched application
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'YILBAY-OPENAI-API-HOME' /tmp/yilbay062/src/app/server.js
          grep -q 'YILBAY-DEVELOPMENT-HOME' /tmp/yilbay062/src/app/server.js
          grep -q 'windows-credential-manager' /tmp/yilbay062/src/app/server.js
          node --check /tmp/yilbay062/src/app/server.js
          node --check /tmp/yilbay062/src/app/public/app.js
          node /tmp/yilbay062/src/app/tests.js

      - name: Build ZIP and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.6.2.zip
          cd /tmp/yilbay062/src
          zip -q -r "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.6.2.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -t release/YILBAY_APP_v0.6.2.zip
          SHA="$(sha256sum release/YILBAY_APP_v0.6.2.zip | awk '{print $1}')"
          echo "V062_SHA=$SHA" >> "$GITHUB_ENV"
          echo "v0.6.2 SHA256: $SHA"

      - name: Write updater manifest
        shell: bash
        run: |
          cat > release/latest.json <<JSON
          {
            "version": "0.6.2",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.6.2.zip",
            "sha256": "$V062_SHA"
          }
          JSON

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.6.2.zip release/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified v0.6.2 release [skip ci]'
          git push origin main
