name: Publish v0.6.4 verified package

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.6.4.py'
      - '.github/workflows/publish-v064.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified v0.6.3 base
        shell: bash
        run: |
          set -euo pipefail
          test -f release/YILBAY_APP_v0.6.3.zip
          rm -rf /tmp/yilbay064
          mkdir -p /tmp/yilbay064/src
          unzip -q release/YILBAY_APP_v0.6.3.zip -d /tmp/yilbay064/src

      - name: Apply deterministic v0.6.4 patch
        shell: bash
        run: |
          set -euo pipefail
          python release_build/v0.6.4.py

      - name: Validate patched application
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CredEnumerateW' /tmp/yilbay064/src/app/server.js
          grep -q 'cmdkey.exe' /tmp/yilbay064/src/app/server.js
          grep -q 'version:"0.6.4"' /tmp/yilbay064/src/app/server.js
          node --check /tmp/yilbay064/src/app/server.js
          node --check /tmp/yilbay064/src/app/public/app.js
          node /tmp/yilbay064/src/app/tests.js

      - name: Build ZIP and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.6.4.zip
          cd /tmp/yilbay064/src
          zip -q -r "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.6.4.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -t release/YILBAY_APP_v0.6.4.zip
          SHA="$(sha256sum release/YILBAY_APP_v0.6.4.zip | awk '{print $1}')"
          echo "V064_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Write updater manifest
        shell: bash
        run: |
          cat > release/latest.json <<JSON
          {
            "version": "0.6.4",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.6.4.zip",
            "sha256": "$V064_SHA"
          }
          JSON

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.6.4.zip release/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified v0.6.4 release [skip ci]'
          git push origin main
