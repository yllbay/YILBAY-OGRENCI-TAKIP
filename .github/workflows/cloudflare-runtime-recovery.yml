name: GENESIS Runtime Recovery

on:
  push:
    branches: [cloudflare-release]
    paths: [cloudflare/runtime-recovery-trigger.txt]

concurrency:
  group: genesis-web-0152-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANA_PRG_RELEASE: ${{ contains(github.event.head_commit.message, '[ana-prg]') && '1' || '0' }}
      CORE_ONLY: ${{ contains(github.event.head_commit.message, '[core-only]') && '1' || '0' }}
      CORE_SCOPE: ${{ (contains(github.event.head_commit.message, '[core-only]') || contains(github.event.head_commit.message, '[core-scope]')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - name: Snapshot deployed source
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery/snapshot
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/workers/scripts/genesis-web-0152/content/v2" -H "$AUTH" -o /tmp/recovery/snapshot/worker.bin
          curl -fsS "$API/workers/scripts/genesis-web-0152/settings" -H "$AUTH" -o /tmp/recovery/snapshot/settings.json
          curl -fsS "$API/workers/scripts/genesis-web-0152/deployments" -H "$AUTH" -o /tmp/recovery/snapshot/deployments.json
          npx --yes wrangler@4 containers info a03b84d1-3560-43de-8d60-55bbca682961 > /tmp/recovery/snapshot/container.json
          IMAGE="$(jq -r '.configuration.image' /tmp/recovery/snapshot/container.json)"
          curl -fsS -X POST "$API/containers/registries/registry.cloudflare.com/credentials" -H "$AUTH" -H 'Content-Type: application/json' --data '{"expiration_minutes":20,"permissions":["pull"]}' -o /tmp/recovery/registry.json
          REG_USER="$(jq -r '.result.username' /tmp/recovery/registry.json)"
          REG_PASS="$(jq -r '.result.password' /tmp/recovery/registry.json)"
          echo "::add-mask::$REG_USER"
          echo "::add-mask::$REG_PASS"
          echo "RECOVERY_BASE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "REG_USER=$REG_USER" >> "$GITHUB_ENV"
          echo "REG_PASS=$REG_PASS" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo umoci
          skopeo inspect --config --creds "$REG_USER:$REG_PASS" "docker://$IMAGE" > /tmp/recovery/snapshot/image-config.json
          skopeo copy --src-creds "$REG_USER:$REG_PASS" "docker://$IMAGE" oci:/tmp/recovery/oci:live
          umoci unpack --rootless --image /tmp/recovery/oci:live /tmp/recovery/bundle
          cp /tmp/recovery/bundle/rootfs/app/start-container.sh /tmp/recovery/snapshot/
          cd /tmp/recovery/bundle/rootfs/app
          tar -cJf /tmp/recovery/snapshot/app-source.tar.xz --exclude='__pycache__' --exclude='_vendor' --exclude='DATA' --exclude='*.db*' APP
          echo 'PRODUCTION_SOURCE_SNAPSHOT_OK'
      - name: Read-only Question Studio baseline
        env:
          RESTORE_REQUEST: ${{ contains(github.event.head_commit.message, '[pool-restore]') }}
        run: |
          set -euo pipefail
          URL=https://genesis-web-0152.yilbayonurcelik.workers.dev
          python3 cloudflare/question_pool_audit_access.py create
          if [ "$RESTORE_REQUEST" = "true" ]; then
            python3 cloudflare/question_pool_audit_access.py download-assets /tmp/recovery/snapshot/pool-assets-before.json
          else
            curl -fsS --max-time 15 "$URL/api/internal/question-studio-integrity-v4" -o /tmp/recovery/snapshot/pool-assets-before.json
          fi
          python3 cloudflare/question_pool_audit_access.py download /tmp/recovery/pool-before.db
          PYTHONPATH=cloudflare python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from question_pool_policy import fingerprint
          con=sqlite3.connect('/tmp/recovery/pool-before.db')
          assert con.execute('PRAGMA quick_check').fetchone()[0]=='ok'
          Path('/tmp/recovery/snapshot/pool-fingerprint-before.json').write_text(json.dumps(fingerprint(con)))
          con.close()
          print('READ_ONLY_AUTHORITATIVE_POOL_BASELINE_OK')
          PY
      - name: Save exact dated runtime checkpoint without deployment
        if: contains(github.event.head_commit.message, '[pool-checkpoint]')
        env:
          GENESIS_RESTORE_KEY: ${{ secrets.GENESIS_RESTORE_20261001_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL=https://genesis-web-0152.yilbayonurcelik.workers.dev
          curl -fsS --max-time 15 "$URL/_health" -o /tmp/recovery/snapshot/checkpoint-health.json
          jq -e '.ok and .restored and .last_error==null and .pool_policy=="GENESIS_QUESTION_POOL_USER_OWNED_V2" and .pool_pending==false' /tmp/recovery/snapshot/checkpoint-health.json
          python3 cloudflare/restore_point.py capture
          python3 cloudflare/question_pool_audit_access.py download /tmp/recovery/pool-checkpoint-after.db
          curl -fsS --max-time 15 "$URL/api/internal/question-studio-integrity-v4" -o /tmp/recovery/snapshot/checkpoint-assets-after.json
          PYTHONPATH=cloudflare python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from question_pool_policy import fingerprint
          p=Path('/tmp/recovery/snapshot')
          with sqlite3.connect('/tmp/recovery/pool-checkpoint-after.db') as db:
              assert fingerprint(db)['sha256']==json.loads((p/'pool-fingerprint-before.json').read_text())['sha256'], 'Pool changed during checkpoint'
          before=json.loads((p/'pool-assets-before.json').read_text())
          after=json.loads((p/'checkpoint-assets-after.json').read_text())
          assert before['question_assets_fingerprint']==after['question_assets_fingerprint'], 'R2 assets changed during checkpoint'
          (p/'checkpoint-release-notes.md').write_text('GENESIS 01.10.2026: exact v115 runtime + Worker. Encrypted complete OCI image and source archive. Restore preserves the CURRENT question database and R2 assets; no data rollback.\n')
          print('CHECKPOINT_PROTECTED_DATA_UNCHANGED_NO_DEPLOYMENT')
          PY
          gh release create genesis-restore-2026-10-01 \
            /tmp/recovery/snapshot/genesis-restore-2026-10-01.tar.enc \
            /tmp/recovery/snapshot/restore-point.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title 'GENESIS geri yükleme noktası — 01.10.2026 (v115)' \
            --notes-file /tmp/recovery/snapshot/checkpoint-release-notes.md
      - name: Load checksum-verified saved runtime checkpoint
        if: contains(github.event.head_commit.message, '[pool-restore]')
        env:
          GENESIS_RESTORE_KEY: ${{ secrets.GENESIS_RESTORE_20261001_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 cloudflare/restore_point.py load
      - name: Build and check recovered application
        if: contains(github.event.head_commit.message, '[recover]') || contains(github.event.head_commit.message, '[pool-candidate]')
        run: |
          set -euo pipefail
          ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          curl -fsS -X POST "$API/containers/registries/registry.cloudflare.com/credentials" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"expiration_minutes":20,"permissions":["pull","push"]}' -o /tmp/recovery/build-registry.json
          REG_USER="$(jq -r '.result.username' /tmp/recovery/build-registry.json)"
          REG_PASS="$(jq -r '.result.password' /tmp/recovery/build-registry.json)"
          echo "::add-mask::$REG_USER"
          echo "::add-mask::$REG_PASS"
          printf '%s' "$REG_PASS" | docker login registry.cloudflare.com --username "$REG_USER" --password-stdin
          IMAGE="registry.cloudflare.com/$ACCOUNT/genesis-web-0152-genesiscontainer:runtime-recovery-${GITHUB_SHA::12}"
          echo "RECOVERY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          ROOT=/tmp/recovery/bundle/rootfs/app
          cp cloudflare/runtime_storage.py "$ROOT/APP/backend/runtime_storage.py"
          cp cloudflare/question_pool_policy.py "$ROOT/APP/backend/question_pool_policy.py"
          python3 cloudflare/question_pool_storage_acceptance.py
          python3 -m pip install --quiet --disable-pip-version-check --target "$ROOT/APP/backend/_vendor" 'boto3>=1.34,<2'
          GENESIS_CONTAINER_ROOT="$ROOT" python3 cloudflare/runtime_recovery_install.py
          GENESIS_CONTAINER_ROOT="$ROOT" python3 cloudflare/question_pool_protection_install.py
          GENESIS_CONTAINER_ROOT="$ROOT" python3 cloudflare/question_pool_user_permissions_install.py
          if [ "$CORE_SCOPE" = "1" ]; then
            GENESIS_APP_ROOT="$ROOT/APP" python3 cloudflare/home_dashboard.py
          fi
          if [ "$ANA_PRG_RELEASE" = "1" ]; then
            GENESIS_CONTAINER_ROOT="$ROOT" python3 cloudflare/ana_prg_install.py
            python3 -m pip install --quiet --disable-pip-version-check fastapi==0.116.1 python-multipart==0.0.20 httpx Pillow PyMuPDF
            python3 cloudflare/ana_prg_acceptance.py
            python3 cloudflare/ana_prg_r2_acceptance.py
            node --check cloudflare/ana_prg/web/ana.js
          fi
          python3 -m compileall -q "$ROOT/APP/backend"
          node --check "$ROOT/APP/frontend/dist/app-0.10.7.js"
          (cd "$ROOT" && tar -cJf /tmp/recovery/snapshot/accepted-app-source.tar.xz --exclude='__pycache__' --exclude='_vendor' --exclude='DATA' --exclude='*.db*' APP)
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/recovery/bundle/rootfs/app')
          data=root/'DATA'
          if data.is_symlink():
              data.unlink()
          elif data.exists():
              assert data.resolve().is_relative_to(root.resolve())
              shutil.rmtree(data)
          data.mkdir()
          PY
          ln -s /tmp/recovery /tmp/genesis-v3
          ln -s oci /tmp/recovery/current-oci
          NEW_IMAGE="$IMAGE" python3 cloudflare/rebuild_v3_image.py
          docker run -d --name genesis-recovery-canary -e GENESIS_STORAGE_MODE=local -p 127.0.0.1:18000:8000 "$IMAGE"
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/_health -o /tmp/recovery/snapshot/canary-health.json; then break; fi
            sleep 1
          done
          jq -e '.ok and .runtime=="GENESIS_LOCAL_SQLITE_R2_V1"' /tmp/recovery/snapshot/canary-health.json
          curl -fsS --max-time 10 -c /tmp/recovery/cookies http://127.0.0.1:18000/ -o /tmp/recovery/canary-root.html
          curl -fsS --max-time 10 -b /tmp/recovery/cookies http://127.0.0.1:18000/api/topics -o /tmp/recovery/canary-topics.json
          jq -e 'type=="array"' /tmp/recovery/canary-topics.json
          curl -fsS --max-time 10 -b /tmp/recovery/cookies http://127.0.0.1:18000/api/test-tree -o /tmp/recovery/canary-tests.json
          jq -e 'type=="array"' /tmp/recovery/canary-tests.json
          docker exec genesis-recovery-canary python -c 'import sqlite3; from pathlib import Path; p=Path("/app/DATA/genesis.db"); assert p.is_file() and not p.parent.is_symlink(); c=sqlite3.connect(p); assert c.execute("PRAGMA quick_check").fetchone()[0]=="ok"; print("LOCAL_SQLITE_INTEGRITY_OK")'
          docker cp cloudflare/question_pool_acceptance.py genesis-recovery-canary:/tmp/question_pool_acceptance.py
          docker exec -e ANA_PRG_RELEASE="$ANA_PRG_RELEASE" -e CORE_ONLY="$CORE_SCOPE" genesis-recovery-canary python /tmp/question_pool_acceptance.py
          if [ "$ANA_PRG_RELEASE" = "1" ]; then
            docker cp cloudflare/ana_prg_runtime_acceptance.py genesis-recovery-canary:/tmp/ana_prg_runtime_acceptance.py
            docker exec genesis-recovery-canary python /tmp/ana_prg_runtime_acceptance.py
            docker restart genesis-recovery-canary
            for attempt in $(seq 1 45); do
              if curl -fsS --max-time 2 http://127.0.0.1:18000/_health >/dev/null; then break; fi
              sleep 1
            done
            docker exec genesis-recovery-canary python /tmp/ana_prg_runtime_acceptance.py --restart
          fi
          docker logs genesis-recovery-canary > /tmp/recovery/snapshot/canary.log 2>&1
          docker stop genesis-recovery-canary
          docker push "$IMAGE"
          IMMUTABLE_IMAGE=$(docker image inspect "$IMAGE" --format='{{index .RepoDigests 0}}')
          case "$IMMUTABLE_IMAGE" in registry.cloudflare.com/*@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$IMMUTABLE_IMAGE" > /tmp/recovery/snapshot/verified-candidate-image.txt
      - name: Cache Playwright Chromium
        if: contains(github.event.head_commit.message, '[pool-ui-check]') || contains(github.event.head_commit.message, '[pool-release]') || contains(github.event.head_commit.message, '[pool-candidate]') || contains(github.event.head_commit.message, '[recover]') || contains(github.event.head_commit.message, '[pool-restore]')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: genesis-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Check browser UI on the verified image with disposable data
        if: contains(github.event.head_commit.message, '[pool-ui-check]') || contains(github.event.head_commit.message, '[pool-release]') || contains(github.event.head_commit.message, '[pool-candidate]') || contains(github.event.head_commit.message, '[recover]') || contains(github.event.head_commit.message, '[pool-restore]')
        run: |
          set -euo pipefail
          if [ "$CORE_ONLY" = "1" ]; then
            IMAGE="$RECOVERY_BASE_IMAGE"
          else
            IMAGE="${RECOVERY_IMAGE:-$(cat cloudflare/runtime-activation-image.txt)}"
          fi
          printf '%s' "$REG_PASS" | docker login registry.cloudflare.com --username "$REG_USER" --password-stdin
          docker pull "$IMAGE"
          docker run -d --name genesis-pool-ui -e GENESIS_STORAGE_MODE=local -p 127.0.0.1:18000:8000 "$IMAGE"
          trap 'docker logs genesis-pool-ui > /tmp/recovery/snapshot/pool-ui-container.log 2>&1; docker stop genesis-pool-ui' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/_health >/dev/null; then break; fi
            sleep 1
          done
          docker cp cloudflare/question_pool_acceptance.py genesis-pool-ui:/tmp/question_pool_acceptance.py
          docker exec -e ANA_PRG_RELEASE="$ANA_PRG_RELEASE" -e CORE_ONLY="$CORE_SCOPE" genesis-pool-ui python /tmp/question_pool_acceptance.py
          python3 -m pip install --quiet --disable-pip-version-check playwright PyMuPDF Pillow
          python3 -m playwright install --with-deps chromium
          python3 cloudflare/question_pool_ui_acceptance.py
          if [ "$ANA_PRG_RELEASE" = "1" ]; then
            docker cp cloudflare/ana_prg_runtime_acceptance.py genesis-pool-ui:/tmp/ana_prg_runtime_acceptance.py
            docker exec genesis-pool-ui python /tmp/ana_prg_runtime_acceptance.py
            python3 cloudflare/ana_prg_ui_acceptance.py
          fi
      - name: Persist verified candidate activation image
        if: success() && contains(github.event.head_commit.message, '[pool-candidate]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="$(cat /tmp/recovery/snapshot/verified-candidate-image.txt)"
          case "$IMAGE" in registry.cloudflare.com/*@sha256:*) ;; *) exit 1 ;; esac
          PATHNAME=cloudflare/runtime-activation-image.txt
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATHNAME?ref=cloudflare-release" --jq '.sha')"
          CONTENT="$(printf '%s\n' "$IMAGE" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PATHNAME" \
            -f message='ci(runtime): activate fully verified candidate image' \
            -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch='cloudflare-release'
          echo "VERIFIED_CANDIDATE_ACTIVATION_POINTER=$IMAGE"

      - name: Prepare preserved Worker and deploy recovery
        if: contains(github.event.head_commit.message, '[recover]') || contains(github.event.head_commit.message, '[pool-release]') || contains(github.event.head_commit.message, '[pool-restore]')
        env:
          RESTORE_REQUEST: ${{ contains(github.event.head_commit.message, '[pool-restore]') }}
        run: |
          set -euo pipefail
          if [ "$CORE_ONLY" = "1" ]; then
            RECOVERY_IMAGE="$RECOVERY_BASE_IMAGE"
            export RECOVERY_IMAGE
          elif [ -z "${RECOVERY_IMAGE:-}" ]; then
            RECOVERY_IMAGE="$(cat cloudflare/runtime-activation-image.txt)"
            export RECOVERY_IMAGE
          fi
          echo "RECOVERY_IMAGE=$RECOVERY_IMAGE" >> "$GITHUB_ENV"
          URL=https://genesis-web-0152.yilbayonurcelik.workers.dev
          curl -fsS --max-time 15 "$URL/_health" -o /tmp/recovery/snapshot/health-before-restart.json || true
          if jq -e '.runtime=="GENESIS_LOCAL_SQLITE_R2_V1"' /tmp/recovery/snapshot/health-before-restart.json >/dev/null 2>&1; then
            curl -fsS --max-time 15 -c /tmp/recovery/baseline-cookies "$URL/" -o /tmp/recovery/baseline-root.html
            ROUTES="api/topics api/test-tree api/coaching/v3/classes api/coaching/v2/students"
            if [ "$ANA_PRG_RELEASE" = "1" ] || [ "$RESTORE_REQUEST" = "true" ] || [ "$CORE_SCOPE" = "1" ]; then ROUTES="api/topics api/test-tree"; fi
            for route in $ROUTES; do
              curl -fsS --max-time 15 -b /tmp/recovery/baseline-cookies "$URL/$route" -o "/tmp/recovery/snapshot/before-$(echo "$route" | tr / -).json"
            done
          fi
          python3 cloudflare/runtime_recovery_prepare.py
          node --check /tmp/recovery/runtime/index.js
          cd /tmp/recovery/runtime
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/recovery/worker-build --keep-vars --containers-rollout=none
          echo 'RECOVERY_DEPLOYED=1' >> "$GITHUB_ENV"
          if [ "$CORE_ONLY" = "1" ]; then
            npx --yes wrangler@4 deploy --keep-vars --containers-rollout=none
          else
            npx --yes wrangler@4 deploy --keep-vars --containers-rollout=immediate
          fi
      - name: Verify production and persistence
        if: contains(github.event.head_commit.message, '[recover]') || contains(github.event.head_commit.message, '[pool-release]') || contains(github.event.head_commit.message, '[pool-restore]') || contains(github.event.head_commit.message, '[pool-ui-check]')
        env:
          RESTORE_REQUEST: ${{ contains(github.event.head_commit.message, '[pool-restore]') }}
        run: |
          set -euo pipefail
          URL=https://genesis-web-0152.yilbayonurcelik.workers.dev
          OLD_BOOT="$(jq -r '.boot_id // empty' /tmp/recovery/snapshot/health-before-restart.json 2>/dev/null || true)"
          EXPECT_RESTART=0
          if [ "$CORE_ONLY" != "1" ] && [ -n "${RECOVERY_IMAGE:-}" ] && [ "$RECOVERY_IMAGE" != "$RECOVERY_BASE_IMAGE" ]; then
            EXPECT_RESTART=1
          fi
          export EXPECT_RESTART
          READY=0
          for attempt in $(seq 1 60); do
            curl -sS --max-time 15 "$URL/_health" -o /tmp/recovery/snapshot/production-health.json || true
            if jq -e '.ok and .pool_policy=="GENESIS_QUESTION_POOL_USER_OWNED_V2" and .pool_revision!=null and .restored and .last_sync!=null and .last_error==null and .boot_id!=null' /tmp/recovery/snapshot/production-health.json >/dev/null 2>&1; then
              NEW_BOOT="$(jq -r '.boot_id // empty' /tmp/recovery/snapshot/production-health.json)"
              if [ "$EXPECT_RESTART" = "0" ] || [ -z "$OLD_BOOT" ] || [ "$NEW_BOOT" != "$OLD_BOOT" ]; then
                READY=1
                break
              fi
            fi
            sleep 3
          done
          test "$READY" = "1"
          jq -e '.ok and .pool_policy=="GENESIS_QUESTION_POOL_USER_OWNED_V2" and .pool_revision!=null and .restored and .last_sync!=null and .last_error==null and .boot_id!=null' /tmp/recovery/snapshot/production-health.json
          curl -fsS --max-time 15 -c /tmp/recovery/live-cookies "$URL/" -o /tmp/recovery/snapshot/production-root.html
          grep -q GENESIS_EDGE_HOME_OVERLAY_DISABLED_V5 /tmp/recovery/snapshot/production-root.html
          grep -q GENESIS_HOME_DASHBOARD_V3 /tmp/recovery/snapshot/production-root.html
          ! grep -q 'id="genesisCoreHomeLauncher"' /tmp/recovery/snapshot/production-root.html
          ! grep -q 'id="edgeHomeQuestionStudio"' /tmp/recovery/snapshot/production-root.html
          ROUTES="api/auth/me api/topics api/test-tree api/coaching/v3/classes api/coaching/v3/curriculum api/coaching/v2/students api/internal/question-studio-fingerprint api/question-pool/revision"
          if [ "$RESTORE_REQUEST" = "true" ] || [ "$CORE_SCOPE" = "1" ]; then
            ROUTES="api/auth/me api/topics api/test-tree api/internal/question-studio-fingerprint api/question-pool/revision"
          elif [ "$ANA_PRG_RELEASE" = "1" ]; then
            curl -fsS --max-time 15 "$URL/ana-prg" -o /tmp/recovery/snapshot/production-ana.html
            grep -q '/ana-prg/ana.js' /tmp/recovery/snapshot/production-ana.html
            CODE=$(curl -sS --max-time 15 "$URL/coaching" -o /tmp/recovery/retired-coaching.json -w '%{http_code}')
            test "$CODE" = 410
            CODE=$(curl -sS --max-time 15 "$URL/api/ana-prg/students" -o /tmp/recovery/ana-unauthorized.json -w '%{http_code}')
            test "$CODE" = 401
            ROUTES="api/auth/me api/topics api/test-tree api/internal/question-studio-fingerprint api/question-pool/revision"
          elif [ "$RESTORE_REQUEST" != "true" ] && [ "$CORE_SCOPE" != "1" ]; then
            curl -fsS --max-time 15 -b /tmp/recovery/live-cookies "$URL/coaching" -o /tmp/recovery/snapshot/production-coaching.html
            grep -q GENESIS_COACHING_DASHBOARD_EDGE_V4 /tmp/recovery/snapshot/production-coaching.html
          fi
          for route in $ROUTES; do
            curl -fsS --max-time 15 -b /tmp/recovery/live-cookies "$URL/$route" -o "/tmp/recovery/snapshot/$(echo "$route" | tr / -).json"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          snapshot=Path('/tmp/recovery/snapshot')
          # Pre-deploy live API may be stale relative to the authoritative R2
          # snapshot. Record representation drift for diagnosis, but protect data
          # with the authoritative SQLite/R2 fingerprints checked below.
          for before in snapshot.glob('before-api-*.json'):
              after=snapshot/before.name.removeprefix('before-')
              if after.is_file() and json.loads(before.read_text())!=json.loads(after.read_text()):
                  print(f"::warning::Live API representation refreshed after restart: {before.name}")
          health=json.loads((snapshot/'production-health.json').read_text())
          assert health.get('boot_id'), 'New container boot identifier missing'
          before=snapshot/'health-before-restart.json'
          if before.is_file():
              try: old=json.loads(before.read_text())
              except ValueError: old={}
              if os.environ.get('EXPECT_RESTART')=='1':
                  assert old.get('boot_id')!=health['boot_id'], 'Container did not restart'
          print('CONTAINER_RESTART_VERIFIED' if os.environ.get('EXPECT_RESTART')=='1'
                else 'WORKER_ONLY_NO_CONTAINER_RESTART_REQUIRED')
          PY
          curl -fsS --max-time 15 "$URL/api/internal/question-studio-integrity-v4" -o /tmp/recovery/snapshot/r2-after.json
          jq -e '.genesis_db.exists and .genesis_db.size>0' /tmp/recovery/snapshot/r2-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/recovery/snapshot')
          before=json.loads((p/'pool-fingerprint-before.json').read_text())
          after=json.loads((p/'api-internal-question-studio-fingerprint.json').read_text())
          assert before['sha256']==after['sha256'], 'Protected SQLite content changed'
          old=json.loads((p/'pool-assets-before.json').read_text())
          new=json.loads((p/'r2-after.json').read_text())
          assert old['question_assets_fingerprint']==new['question_assets_fingerprint'], 'Protected R2 assets changed'
          auth=json.loads((p/'api-auth-me.json').read_text())
          assert auth['authenticated'] and auth['role']=='ADMIN'
          print('PROTECTED_SQLITE_AND_R2_FINGERPRINTS_UNCHANGED')
          PY
          CODE=$(curl -sS --max-time 15 -b /tmp/recovery/live-cookies "$URL/api/online/internet-test/genesis-audit-invalid-token" -o /tmp/recovery/invalid.json -w '%{http_code}')
          test "$CODE" = 404
          curl -fsS --max-time 15 -c /tmp/recovery/second-cookies "$URL/" -o /tmp/recovery/second-root.html
          curl -fsS --max-time 15 -b /tmp/recovery/second-cookies "$URL/api/internal/question-studio-fingerprint" -o /tmp/recovery/snapshot/pool-second-session.json
          jq -r '.sha256' /tmp/recovery/snapshot/pool-second-session.json > /tmp/recovery/second-hash
          jq -r '.sha256' /tmp/recovery/snapshot/api-internal-question-studio-fingerprint.json > /tmp/recovery/first-hash
          cmp /tmp/recovery/first-hash /tmp/recovery/second-hash
          python3 cloudflare/question_pool_production_ui.py
          npx --yes wrangler@4 containers info a03b84d1-3560-43de-8d60-55bbca682961 > /tmp/recovery/snapshot/container-after.json
          echo 'GENESIS_RUNTIME_RECOVERY_VERIFIED'
      - name: Persist restored activation image
        if: success() && contains(github.event.head_commit.message, '[pool-restore]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_IMAGE:-}"
          PATHNAME=cloudflare/runtime-activation-image.txt
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATHNAME?ref=cloudflare-release" --jq '.sha')"
          CONTENT="$(printf '%s\n' "$RECOVERY_IMAGE" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$PATHNAME" \
            -f message='fix(runtime): sync activation pointer after verified restore' \
            -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch='cloudflare-release'
          echo "RESTORE_ACTIVATION_POINTER_SYNCED=$RECOVERY_IMAGE"

      - name: Automatic rollback after failed production gate
        if: failure() && env.RECOVERY_DEPLOYED == '1'
        run: |
          set -euo pipefail
          export RECOVERY_IMAGE="$RECOVERY_BASE_IMAGE"
          unset RECOVERY_WORKER_PACKAGE
          export ANA_PRG_RELEASE=0
          export CORE_ONLY=0
          export CORE_SCOPE=0
          # Restore both the previous image and its rollout grace so rollback is
          # a real control-plane change even when Cloudflare is eventually consistent.
          export RECOVERY_ROLLOUT_GRACE="$(jq -r '.rollout_active_grace_period // 1' /tmp/recovery/snapshot/container.json)"
          python3 cloudflare/runtime_recovery_prepare.py
          cd /tmp/recovery/runtime
          npx --yes wrangler@4 deploy --keep-vars --containers-rollout=immediate
          URL=https://genesis-web-0152.yilbayonurcelik.workers.dev
          ROLLBACK_OK=0
          for attempt in $(seq 1 60); do
            curl -sS --max-time 15 "$URL/_health" -o /tmp/recovery/snapshot/rollback-health.json || true
            npx --yes wrangler@4 containers info a03b84d1-3560-43de-8d60-55bbca682961 > /tmp/recovery/snapshot/rollback-container.json
            IMG="$(jq -r '.configuration.image // empty' /tmp/recovery/snapshot/rollback-container.json)"
            F="$(jq -r '.health.instances.failed // 0' /tmp/recovery/snapshot/rollback-container.json)"
            E="$(jq -r '.health.errors|length' /tmp/recovery/snapshot/rollback-container.json)"
            if [ "$IMG" = "$RECOVERY_BASE_IMAGE" ] && [ "$F" -eq 0 ] && [ "$E" -eq 0 ]; then
              ROLLBACK_OK=1
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              npx --yes wrangler@4 deploy --keep-vars --containers-rollout=immediate || true
            fi
            sleep 3
          done
          test "$ROLLBACK_OK" = "1"
          curl -fsS --max-time 15 "$URL/" -o /tmp/recovery/snapshot/rollback-root.html
          echo 'PREVIOUS_WORKING_IMAGE_AND_WORKER_ROLLBACK_VERIFIED'
      - name: Capture failed runtime diagnostics
        if: failure() && env.RECOVERY_DEPLOYED == '1'
        run: |
          timeout 35s npx --yes wrangler@4 tail genesis-web-0152 --format json > /tmp/recovery/snapshot/runtime-tail.jsonl 2>&1 || true
      - name: Remove ephemeral read-only audit Worker
        if: always()
        run: python3 cloudflare/question_pool_audit_access.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-recovery-source
          path: /tmp/recovery/snapshot
          retention-days: 3
