name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.9.4/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.9.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay094 /tmp/microtools
          cp -a source/current /tmp/yilbay094
          test "$(cat /tmp/yilbay094/app/VERSION | tr -d '\r\n')" = "0.9.3"
          test -s /tmp/yilbay094/app/public/app.js
          test -s /tmp/yilbay094/app/server.js
          test -s /tmp/yilbay094/app/bootstrap/orchestrator_node.js

      - name: Patch fullscreen launcher and homework context
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.4/patch_cells_v094.mjs
          grep -q -- '--start-fullscreen' /tmp/yilbay094/app/bootstrap/orchestrator_node.js
          grep -q 'function assignmentResourceContext' /tmp/yilbay094/app/public/app.js
          grep -q 'function driveDownloadAnalysisFile' /tmp/yilbay094/app/server.js
          grep -q 'function installLaunchPreferences' /tmp/yilbay094/app/server.js
          grep -q 'validateHomeworkQuestionCount' /tmp/yilbay094/app/server.js

      - name: Install build-only AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.4/microcellularize.mjs

      - name: Strict micro-cell and feature tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import vm from 'vm';
          import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay094';
          const m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.protocol!=='micro-cell-v2-ast'||m.version!=='0.9.4') throw new Error('manifest protocol/version');
          if(m.counts.frontend<87) throw new Error('assignment resource context cell missing: '+m.counts.frontend);
          if(m.counts.backend<47) throw new Error('backend feature cells missing: '+m.counts.backend);
          for(const entry of [...m.frontend,...m.backend]){
            const src=fs.readFileSync(root+'/'+entry.file,'utf8');
            const ast=parse(src,{ecmaVersion:'latest',sourceType:'script'});
            if(ast.body.length!==1) throw new Error(entry.file+' has '+ast.body.length+' top-level nodes');
            if(ast.body[0].type!==entry.nodeType) throw new Error(entry.file+' node mismatch');
          }
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          const b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')) throw new Error('frontend bundle mismatch');
          if(b!==fs.readFileSync(root+'/app/server.js','utf8')) throw new Error('backend bundle mismatch');
          for(const name of ['assignmentResourceContext','submitHomeworkAnalysis']) if(!m.frontend.find(x=>x.name===name)) throw new Error(name+' cell missing');
          for(const name of ['driveDownloadAnalysisFile','validateHomeworkQuestionCount','installLaunchPreferences']) if(!m.backend.find(x=>x.name===name)) throw new Error(name+' cell missing');
          const qc=m.backend.find(x=>x.name==='validateHomeworkQuestionCount');const qctx={};vm.createContext(qctx);vm.runInContext(fs.readFileSync(root+'/'+qc.file,'utf8'),qctx);
          let a={totalQuestions:20,needsTeacherReview:false,autoFinalize:true};let v=qctx.validateHomeworkQuestionCount(a,20);if(v.questionCountMismatch||v.autoFinalize!==true)throw new Error('question count match failed');
          v=qctx.validateHomeworkQuestionCount(a,25);if(!v.questionCountMismatch||v.autoFinalize!==false||!v.needsTeacherReview)throw new Error('question count mismatch review failed');
          const boot=fs.readFileSync(root+'/app/bootstrap/orchestrator_node.js','utf8');
          if(!boot.includes('--start-fullscreen')||!boot.includes('--start-maximized')||!boot.includes('2.1.0-node'))throw new Error('bootstrap fullscreen/version missing');
          if(/ExecutionPolicy\s+Bypass/i.test(boot)||/ExecutionPolicy\s+Bypass/i.test(b))throw new Error('unsafe powershell bypass reintroduced');
          if(!b.includes('/MAX powershell.exe -NoLogo -NoProfile'))throw new Error('maximized PowerShell launcher contract missing');
          if(!f.includes('resourceContext=assignmentResourceContext(a)')||!b.includes('resourceContext?.answerKeyDriveFileId'))throw new Error('homework Drive context wiring missing');
          console.log('STRICT MICRO CELLS',m.counts,'FULLSCREEN + HOMEWORK CONTEXT OK');
          NODE
          while IFS= read -r f; do node --check "/tmp/yilbay094/$f"; done < <(node -e "const m=require('/tmp/yilbay094/cells/micro-cell-manifest.json'); console.log([...m.frontend,...m.backend].map(x=>x.file).join('\\n'))")
          node --check /tmp/yilbay094/app/public/app.js
          node --check /tmp/yilbay094/app/server.js
          node --check /tmp/yilbay094/app/bootstrap/orchestrator_node.js
          node /tmp/yilbay094/app/tests.js
          grep -q 'drive.readonly' /tmp/yilbay094/app/server.js
          grep -q '/api/drive/index' /tmp/yilbay094/app/server.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay094/app/server.js >/tmp/v094_server.log 2>/tmp/v094_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/v094_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 0.5
          done
          cat /tmp/v094_health.json || true
          cat /tmp/v094_server.err || true
          test "$OK" = "1"
          grep -q '"version":"0.9.4"' /tmp/v094_health.json
          curl -fsS http://127.0.0.1:43127/api/drive/status >/tmp/v094_drive.json
          grep -q '"configured":false' /tmp/v094_drive.json
          CODE=$(curl -sS -o /tmp/v094_homework.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:43127/api/ai/analyze-homework)
          test "$CODE" = "400"
          grep -q 'Ödev dosyası gerekli' /tmp/v094_homework.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.9.4.zip
          (cd /tmp/yilbay094 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.9.4.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.9.4.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {
            "version": "0.9.4",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.9.4.zip",
            "sha256": "$SHA"
          }
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay094 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.9.4.zip release/latest.json source/current
          git commit -m 'Publish verified v0.9.4 fullscreen launcher and homework context [skip ci]'
          git push origin main
