name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.10.7/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.10.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay0107 /tmp/microtools
          cp -a source/current /tmp/yilbay0107
          test "$(cat /tmp/yilbay0107/app/VERSION | tr -d '\r\n')" = "0.10.6"

      - name: Patch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.7/patch_v0107.mjs
          grep -q 'correctQuestionNumbers:Array.isArray' /tmp/yilbay0107/app/server.js
          grep -q 'wrongQuestionNumbers:Array.isArray' /tmp/yilbay0107/app/server.js
          grep -q 'function writeHomeworkPdfDiagnostic' /tmp/yilbay0107/app/server.js
          grep -q 'last_homework_pdf.json' /tmp/yilbay0107/app/bootstrap/orchestrator_node.js
          grep -q '2.1.4-node' /tmp/yilbay0107/app/bootstrap/orchestrator_node.js

      - name: Install AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.7/microcellularize.mjs

      - name: Strict diagnostics tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';import vm from 'vm';import path from 'path';import os from 'os';import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay0107',m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.version!=='0.10.7'||m.protocol!=='micro-cell-v2-ast')throw new Error('manifest');
          for(const e of [...m.frontend,...m.backend]){const src=fs.readFileSync(root+'/'+e.file,'utf8'),ast=parse(src,{ecmaVersion:'latest',sourceType:'script'});if(ast.body.length!==1||ast.body[0].type!==e.nodeType)throw new Error(e.file)}
          const cell=n=>m.backend.find(x=>x.name===n);
          for(const n of ['writeHomeworkDiagnostic','writeHomeworkPdfDiagnostic','handleHomeworkReportPdf'])if(!cell(n))throw new Error('missing '+n);
          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'yilbaydiag-'));const ctx={fs,path,runtime:tmp,Date,JSON,Number,String,Array};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(root+'/'+cell('writeHomeworkDiagnostic').file,'utf8'),ctx);
          const d=ctx.writeHomeworkDiagnostic({correctQuestionNumbers:[1,2,3],blankQuestionNumbers:[5],uncertainQuestionNumbers:[7],items:[{question:4,status:'wrong',note:'PRIVATE'}],analysisArchitecture:'direct_luna_wrong_only'}, {try:.25},{id:9});
          if(JSON.stringify(d).includes('PRIVATE'))throw new Error('diagnostic content leak');if(d.correctQuestionNumbers.join(',')!=='1,2,3'||d.wrongQuestionNumbers.join(',')!=='4'||d.blankQuestionNumbers[0]!==5||d.uncertainQuestionNumbers[0]!==7)throw new Error('question lists');
          vm.runInContext(fs.readFileSync(root+'/'+cell('writeHomeworkPdfDiagnostic').file,'utf8'),ctx);const p=ctx.writeHomeworkPdfDiagnostic({generated:true,reportId:'123_abcd',sizeBytes:4567,error:'SECRET'.repeat(200)});if(!p.generated||p.sizeBytes!==4567||p.error.length>300||p.secretsCollected!==false)throw new Error('pdf diagnostic');
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join(''),b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')||b!==fs.readFileSync(root+'/app/server.js','utf8'))throw new Error('bundle mismatch');
          const boot=fs.readFileSync(root+'/app/bootstrap/orchestrator_node.js','utf8');if(!boot.includes('2.1.4-node')||!boot.includes('homework_pdf.json')||!boot.includes('--start-maximized')||boot.includes('--start-fullscreen'))throw new Error('bootstrap regression');
          console.log('V0107 DIAGNOSTICS OK',m.counts);
          NODE
          node --check /tmp/yilbay0107/app/server.js
          node --check /tmp/yilbay0107/app/public/app.js
          node --check /tmp/yilbay0107/app/bootstrap/orchestrator_node.js
          node /tmp/yilbay0107/app/tests.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay0107/app/server.js >/tmp/v0107_server.log 2>/tmp/v0107_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do CODE=$(curl -sS -o /tmp/v0107_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true); [ "$CODE" = "200" ] && break; sleep 0.5; done
          grep -q '"version":"0.10.7"' /tmp/v0107_health.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.10.7.zip
          (cd /tmp/yilbay0107 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.10.7.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.10.7.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {"version":"0.10.7","zip_url":"https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.10.7.zip","sha256":"$SHA"}
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay0107 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.10.7.zip release/latest.json source/current
          git commit -m 'Publish verified v0.10.7 diagnostics [skip ci]'
          git push origin main
