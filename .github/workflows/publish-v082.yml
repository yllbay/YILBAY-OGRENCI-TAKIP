name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.9.9/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.9.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay099 /tmp/microtools
          cp -a source/current /tmp/yilbay099
          test "$(cat /tmp/yilbay099/app/VERSION | tr -d '\r\n')" = "0.9.8"

      - name: Patch assignment modal initialization
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.9/patch_cells_v099.mjs
          grep -q 'assignmentModal' /tmp/yilbay099/app/public/app.js
          grep -q 'refreshAssignmentItems()' /tmp/yilbay099/app/public/app.js

      - name: Install AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.9/microcellularize.mjs

      - name: Strict assignment tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import vm from 'vm';
          import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay099';
          const m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.version!=='0.9.9'||m.protocol!=='micro-cell-v2-ast')throw new Error('manifest');
          for(const e of [...m.frontend,...m.backend]){const s=fs.readFileSync(root+'/'+e.file,'utf8');const a=parse(s,{ecmaVersion:'latest',sourceType:'script'});if(a.body.length!==1||a.body[0].type!==e.nodeType)throw new Error(e.file)}
          const modal=m.frontend.find(x=>x.name==='assignmentModal');
          const refresh=m.frontend.find(x=>x.name==='refreshAssignmentItems');
          const add=m.frontend.find(x=>x.name==='addAssignment');
          if(!modal||!refresh||!add)throw new Error('assignment cells missing');
          const db={students:[{id:1,name:'Test'}],resources:[{id:11,title:'PDF Test',course:'LGS Matematik',topic:'Mutlak Değer'}],exams:[],assignments:[]};
          const els={};let html='';
          const ctx={db,window:{},q:id=>els[id],modal:s=>{html=s;els.akind={value:'PDF Kaynak'};els.aitem={innerHTML:''};els.astudent={value:'1'}},alert:m=>{throw new Error('alert '+m)},Date,save:()=>{},closeModal:()=>{},assignments:()=>{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(root+'/'+refresh.file,'utf8'),ctx);
          vm.runInContext(fs.readFileSync(root+'/'+modal.file,'utf8'),ctx);
          vm.runInContext(fs.readFileSync(root+'/'+add.file,'utf8'),ctx);
          ctx.window.assignmentModal();
          if(!els.aitem.innerHTML.includes('PDF Test')||!els.aitem.innerHTML.includes('value="11"'))throw new Error('PDF list not initialized');
          els.aitem.value='11';ctx.window.addAssignment();
          if(db.assignments.length!==1||db.assignments[0].sourceId!==11||db.assignments[0].kind!=='PDF Kaynak')throw new Error('PDF assignment failed');
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');const b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')||b!==fs.readFileSync(root+'/app/server.js','utf8'))throw new Error('bundle mismatch');
          const boot=fs.readFileSync(root+'/app/bootstrap/orchestrator_node.js','utf8');if(!boot.includes('--start-maximized')||boot.includes('--start-fullscreen'))throw new Error('launch regression');
          console.log('PDF ASSIGNMENT OK',m.counts);
          NODE
          node --check /tmp/yilbay099/app/public/app.js
          node --check /tmp/yilbay099/app/server.js
          node /tmp/yilbay099/app/tests.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay099/app/server.js >/tmp/v099_server.log 2>/tmp/v099_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do CODE=$(curl -sS -o /tmp/v099_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true); [ "$CODE" = "200" ] && break; sleep 0.5; done
          grep -q '"version":"0.9.9"' /tmp/v099_health.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.9.9.zip
          (cd /tmp/yilbay099 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.9.9.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.9.9.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {"version":"0.9.9","zip_url":"https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.9.9.zip","sha256":"$SHA"}
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay099 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.9.9.zip release/latest.json source/current
          git commit -m 'Publish verified v0.9.9 PDF assignment fix [skip ci]'
          git push origin main
