name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.9.2/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.9.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay092 /tmp/microtools
          cp -a source/current /tmp/yilbay092
          test "$(cat /tmp/yilbay092/app/VERSION | tr -d '\r\n')" = "0.9.1"
          test -s /tmp/yilbay092/app/public/app.js
          test -s /tmp/yilbay092/app/server.js
          test -s /tmp/yilbay092/cells/micro-cell-manifest.json

      - name: Patch only related source cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.2/patch_cells_v092.mjs
          grep -q 'function upsertDriveResource' /tmp/yilbay092/app/public/app.js
          grep -q 'upsertDriveResource(x' /tmp/yilbay092/app/public/app.js

      - name: Install build-only AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.2/microcellularize.mjs

      - name: Strict micro-cell and Drive upsert tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import vm from 'vm';
          import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay092';
          const m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.protocol!=='micro-cell-v2-ast'||m.version!=='0.9.2') throw new Error('manifest protocol/version');
          if(m.counts.frontend<84) throw new Error('Drive upsert frontend cell missing: '+m.counts.frontend);
          if(m.counts.backend<42) throw new Error('backend cells missing: '+m.counts.backend);
          for(const entry of [...m.frontend,...m.backend]){
            const src=fs.readFileSync(root+'/'+entry.file,'utf8');
            const ast=parse(src,{ecmaVersion:'latest',sourceType:'script'});
            if(ast.body.length!==1) throw new Error(entry.file+' has '+ast.body.length+' top-level nodes');
            if(ast.body[0].type!==entry.nodeType) throw new Error(entry.file+' node type mismatch');
          }
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          const b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')) throw new Error('frontend bundle mismatch');
          if(b!==fs.readFileSync(root+'/app/server.js','utf8')) throw new Error('backend bundle mismatch');
          const upsert=m.frontend.find(x=>x.name==='upsertDriveResource');
          const index=m.frontend.find(x=>x.name==='indexGoogleDrive');
          if(!upsert||!index) throw new Error('Drive upsert/index cells missing');
          const ctx={db:{resources:[]}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(root+'/'+upsert.file,'utf8'),ctx);
          const x1={id:'drive-1',course:'LGS Matematik',topic:'Mutlak Değer',level:'Orta',title:'Test 01',name:'Test 01.pdf',webViewLink:'https://example.test/1',modifiedTime:'2026-08-26T00:00:00Z'};
          if(ctx.upsertDriveResource(x1,101)!=='added'||ctx.db.resources.length!==1) throw new Error('initial Drive add failed');
          const x2={...x1,title:'Test 01 Yeni',topic:'Mutlak Değer Yeni',modifiedTime:'2026-08-27T00:00:00Z'};
          if(ctx.upsertDriveResource(x2,102)!=='updated'||ctx.db.resources.length!==1) throw new Error('Drive update failed');
          if(ctx.db.resources[0].title!=='Test 01 Yeni'||ctx.db.resources[0].topic!=='Mutlak Değer Yeni'||ctx.db.resources[0].id!==101) throw new Error('Drive update did not preserve local id/update fields');
          ctx.db.resources.push({id:999,driveFileId:'drive-1',title:'duplicate'});
          if(ctx.upsertDriveResource(x2,103)!=='updated'||ctx.db.resources.filter(r=>r.driveFileId==='drive-1').length!==1) throw new Error('Drive duplicate cleanup failed');
          console.log('STRICT MICRO CELLS',m.counts,'DRIVE UPSERT OK');
          NODE
          while IFS= read -r f; do node --check "/tmp/yilbay092/$f"; done < <(node -e "const m=require('/tmp/yilbay092/cells/micro-cell-manifest.json'); console.log([...m.frontend,...m.backend].map(x=>x.file).join('\\n'))")
          node --check /tmp/yilbay092/app/public/app.js
          node --check /tmp/yilbay092/app/server.js
          node /tmp/yilbay092/app/tests.js
          ! grep -qi 'powershell.exe' /tmp/yilbay092/app/server.js
          grep -q 'drive.readonly' /tmp/yilbay092/app/server.js
          grep -q '/api/drive/index' /tmp/yilbay092/app/server.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay092/app/server.js >/tmp/v092_server.log 2>/tmp/v092_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/v092_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 0.5
          done
          cat /tmp/v092_health.json || true
          cat /tmp/v092_server.err || true
          test "$OK" = "1"
          grep -q '"version":"0.9.2"' /tmp/v092_health.json
          curl -fsS http://127.0.0.1:43127/api/drive/status >/tmp/v092_drive.json
          grep -q '"configured":false' /tmp/v092_drive.json
          CODE=$(curl -sS -o /tmp/v092_drive_start.json -w '%{http_code}' -X POST http://127.0.0.1:43127/api/drive/oauth/start)
          test "$CODE" = "400"
          grep -q 'OAuth Client ID/Secret' /tmp/v092_drive_start.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.9.2.zip
          (cd /tmp/yilbay092 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.9.2.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.9.2.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {
            "version": "0.9.2",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.9.2.zip",
            "sha256": "$SHA"
          }
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay092 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.9.2.zip release/latest.json source/current
          git commit -m 'Publish verified v0.9.2 Drive upsert deduplication [skip ci]'
          git push origin main
