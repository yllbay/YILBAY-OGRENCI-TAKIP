name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.10.9/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.10.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay0109 /tmp/microtools
          cp -a source/current /tmp/yilbay0109
          test "$(cat /tmp/yilbay0109/app/VERSION | tr -d '\r\n')" = "0.10.8"

      - name: Patch question status reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.9/patch_v0109.mjs
          grep -q 'questionStatusConflictCount' /tmp/yilbay0109/app/server.js
          grep -q 'question_status_conflict' /tmp/yilbay0109/app/server.js
          grep -q 'status_reconciled' /tmp/yilbay0109/app/server.js

      - name: Install AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.9/microcellularize.mjs

      - name: Strict status reconciliation tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';import vm from 'vm';import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay0109',m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.version!=='0.10.9'||m.protocol!=='micro-cell-v2-ast')throw new Error('manifest');
          for(const e of [...m.frontend,...m.backend]){const src=fs.readFileSync(root+'/'+e.file,'utf8'),ast=parse(src,{ecmaVersion:'latest',sourceType:'script'});if(ast.body.length!==1||ast.body[0].type!==e.nodeType)throw new Error(e.file)}
          const cell=n=>m.backend.find(x=>x.name===n);for(const n of ['normalizeHomeworkQuestionRef','normalizeHomeworkQuestionRefs','finalizeHomeworkQuestionSets','deriveHomeworkReviewReasons','writeHomeworkDiagnostic'])if(!cell(n))throw new Error('missing '+n);
          const ctx={Set,Map,String,Number,Array,Math};vm.createContext(ctx);for(const n of ['normalizeHomeworkQuestionRef','normalizeHomeworkQuestionRefs','finalizeHomeworkQuestionSets','deriveHomeworkReviewReasons'])vm.runInContext(fs.readFileSync(root+'/'+cell(n).file,'utf8'),ctx);
          const refs=[];for(let i=1;i<=9;i++)refs.push({sectionKey:'sayi',section:'Sayı Problemleri',page:i<=5?1:2,printedNumber:i});for(let i=1;i<=11;i++)refs.push({sectionKey:'kesir',section:'Kesir Problemleri',page:i<=6?3:4,printedNumber:i});for(let i=1;i<=13;i++)refs.push({sectionKey:'bos-dolu',section:'Boş-Dolu Problemleri',page:i<=6?5:i<=9?6:7,printedNumber:i});
          let q=ctx.finalizeHomeworkQuestionSets({correctQuestions:refs,blankQuestions:[],uncertainQuestions:[],items:[],autoFinalize:true});if(q.totalQuestions!==33||q.correct!==33||q.classifiedQuestions!==33||!q.questionAccountingVerified)throw new Error('33 regression');
          const conflict=refs.find(x=>x.sectionKey==='kesir'&&x.printedNumber===10);q=ctx.finalizeHomeworkQuestionSets({correctQuestions:refs,blankQuestions:[],uncertainQuestions:[],items:[{...conflict,status:'wrong'}],autoFinalize:true});if(q.totalQuestions!==33||q.classifiedQuestions!==33||q.questionStatusConflictCount!==1||q.uncertain!==1||q.correct!==32||q.wrong!==0||q.questionStatusVerified!==false||!q.needsTeacherReview||q.autoFinalize)throw new Error('status conflict reconciliation '+JSON.stringify(q));q=ctx.deriveHomeworkReviewReasons(q);if(!q.reviewReasons.includes('question_status_conflict'))throw new Error('explicit review reason');
          const front=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join(''),back=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');if(front!==fs.readFileSync(root+'/app/public/app.js','utf8')||back!==fs.readFileSync(root+'/app/server.js','utf8'))throw new Error('bundle mismatch');
          if(!front.includes('deleteHomeworkAnalysis')||!front.includes('Tüm Analiz Geçmişini Temizle'))throw new Error('delete regression');
          const boot=fs.readFileSync(root+'/app/bootstrap/orchestrator_node.js','utf8');if(!boot.includes('2.1.4-node')||!boot.includes('--start-maximized')||boot.includes('--start-fullscreen'))throw new Error('launcher regression');
          console.log('V0109 STATUS RECONCILIATION OK',m.counts);
          NODE
          node --check /tmp/yilbay0109/app/server.js
          node --check /tmp/yilbay0109/app/public/app.js
          node /tmp/yilbay0109/app/tests.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay0109/app/server.js >/tmp/v0109_server.log 2>/tmp/v0109_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do CODE=$(curl -sS -o /tmp/v0109_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true); [ "$CODE" = "200" ] && break; sleep 0.5; done
          grep -q '"version":"0.10.9"' /tmp/v0109_health.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.10.9.zip
          (cd /tmp/yilbay0109 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.10.9.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.10.9.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {"version":"0.10.9","zip_url":"https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.10.9.zip","sha256":"$SHA"}
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay0109 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.10.9.zip release/latest.json source/current
          git commit -m 'Publish verified v0.10.9 status reconciliation [skip ci]'
          git push origin main
