name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.10.5/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.10.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay0105 /tmp/microtools
          cp -a source/current /tmp/yilbay0105
          test "$(cat /tmp/yilbay0105/app/VERSION | tr -d '\r\n')" = "0.10.4"

      - name: Patch direct Luna Vision architecture
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.5/patch_cells_v0105.mjs
          grep -q 'function lunaHomeworkDirectInstruction' /tmp/yilbay0105/app/server.js
          grep -q 'function validateLunaQuestionAccounting' /tmp/yilbay0105/app/server.js
          grep -q 'function validateLunaDirectAnswerKey' /tmp/yilbay0105/app/server.js
          grep -q 'direct_luna_vision' /tmp/yilbay0105/app/server.js
          grep -q 'Pedagojik Karne' /tmp/yilbay0105/app/public/app.js

      - name: Install AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.10.5/microcellularize.mjs

      - name: Strict direct Luna tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';import vm from 'vm';import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay0105',m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.version!=='0.10.5'||m.protocol!=='micro-cell-v2-ast')throw new Error('manifest');
          for(const e of [...m.frontend,...m.backend]){const s=fs.readFileSync(root+'/'+e.file,'utf8'),a=parse(s,{ecmaVersion:'latest',sourceType:'script'});if(a.body.length!==1||a.body[0].type!==e.nodeType)throw new Error(e.file)}
          const ins=m.backend.find(x=>x.name==='lunaHomeworkDirectInstruction'),acc=m.backend.find(x=>x.name==='validateLunaQuestionAccounting'),key=m.backend.find(x=>x.name==='validateLunaDirectAnswerKey'),handle=m.backend.find(x=>x.name==='handleHomework');if(!ins||!acc||!key||!handle)throw new Error('direct Luna cells missing');
          const ctx={};vm.createContext(ctx);vm.runInContext(fs.readFileSync(root+'/'+ins.file,'utf8'),ctx);vm.runInContext(fs.readFileSync(root+'/'+acc.file,'utf8'),ctx);vm.runInContext(fs.readFileSync(root+'/'+key.file,'utf8'),ctx);
          const txt=ctx.lunaHomeworkDirectInstruction();for(const k of ['tüm sayfaları','el yazısı','ilk hata adımını','reasoningProfile'])if(!txt.includes(k))throw new Error('instruction '+k);
          let r=ctx.validateLunaQuestionAccounting({totalQuestions:5,correct:2,wrong:1,blank:1,uncertain:1,items:[],needsTeacherReview:false,autoFinalize:true});if(!r.questionAccountingVerified||r.classifiedQuestions!==5)throw new Error('accounting valid');
          r=ctx.validateLunaQuestionAccounting({totalQuestions:5,correct:2,wrong:1,blank:1,uncertain:0,items:[],needsTeacherReview:false,autoFinalize:true});if(r.questionAccountingVerified||!r.needsTeacherReview)throw new Error('accounting guard');
          r=ctx.validateLunaDirectAnswerKey({answerKeyFound:true,answerKeySource:'embedded_end_pages',answerKeyOriginDocument:'student_pdf',answerKeyConfidence:.9,needsTeacherReview:false,autoFinalize:true},null);if(!r.answerKeyFound||r.needsTeacherReview)throw new Error('embedded key');
          r=ctx.validateLunaDirectAnswerKey({answerKeyFound:true,answerKeySource:'embedded_end_pages',answerKeyOriginDocument:'reference_pdf',answerKeyConfidence:.9,needsTeacherReview:false,autoFinalize:true},null);if(r.answerKeyFound||!r.needsTeacherReview)throw new Error('foreign key guard');
          const hs=fs.readFileSync(root+'/'+handle.file,'utf8');if(hs.includes('resourceContext?.driveFileId')||hs.includes('resourceContext?.answerKeyDriveFileId'))throw new Error('handle still downloads reference Drive files');if(!hs.includes('direct_luna_vision'))throw new Error('architecture marker');
          const resolver=m.backend.find(x=>x.name==='resolveStudentHomeworkFile');let driveCalls=0;const rctx={driveDownloadAnalysisFile:async()=>{driveCalls++;return {base64:'D',mimeType:'application/pdf'}}};vm.createContext(rctx);vm.runInContext(fs.readFileSync(root+'/'+resolver.file,'utf8'),rctx);await rctx.resolveStudentHomeworkFile({studentFileSource:'local',fileData:'L'});if(driveCalls!==0)throw new Error('local touched Drive');await rctx.resolveStudentHomeworkFile({studentFileSource:'drive',studentDriveFileId:'ABC123456789'});if(driveCalls!==1)throw new Error('drive selected file route');
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join(''),b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')||b!==fs.readFileSync(root+'/app/server.js','utf8'))throw new Error('bundle mismatch');
          if(!f.includes('Pedagojik Karne')||!f.includes('Doğrudan Luna Vision'))throw new Error('frontend contract');
          const boot=fs.readFileSync(root+'/app/bootstrap/orchestrator_node.js','utf8');if(!boot.includes('--start-maximized')||boot.includes('--start-fullscreen'))throw new Error('launcher regression');
          console.log('DIRECT LUNA VISION OK',m.counts);
          NODE
          node --check /tmp/yilbay0105/app/public/app.js
          node --check /tmp/yilbay0105/app/server.js
          node /tmp/yilbay0105/app/tests.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay0105/app/server.js >/tmp/v0105_server.log 2>/tmp/v0105_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do CODE=$(curl -sS -o /tmp/v0105_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true); [ "$CODE" = "200" ] && break; sleep 0.5; done
          grep -q '"version":"0.10.5"' /tmp/v0105_health.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.10.5.zip
          (cd /tmp/yilbay0105 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.10.5.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.10.5.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {"version":"0.10.5","zip_url":"https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.10.5.zip","sha256":"$SHA"}
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay0105 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.10.5.zip release/latest.json source/current
          git commit -m 'Publish verified v0.10.5 direct Luna Vision [skip ci]'
          git push origin main
