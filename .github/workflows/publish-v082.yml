name: Publish current verified release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.9.1/**'
      - '.github/workflows/publish-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy verified v0.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay091 /tmp/microtools
          cp -a source/current /tmp/yilbay091
          test "$(cat /tmp/yilbay091/app/VERSION | tr -d '\r\n')" = "0.9.0"
          test -s /tmp/yilbay091/app/public/app.js
          test -s /tmp/yilbay091/app/server.js
          test -s /tmp/yilbay091/cells/micro-cell-manifest.json

      - name: Patch only related source cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.1/patch_cells_v091.mjs
          grep -q 'function normalizeCourseName' /tmp/yilbay091/app/server.js
          grep -q 'normalizeCourseName(course)' /tmp/yilbay091/app/server.js

      - name: Install build-only AST parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/microtools
          npm install --prefix /tmp/microtools --no-audit --no-fund acorn@8

      - name: Rebuild strict micro cells
        shell: bash
        run: |
          set -euo pipefail
          node release_build/v0.9.1/microcellularize.mjs

      - name: Strict micro-cell contract and normalization tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import vm from 'vm';
          import {parse} from '/tmp/microtools/node_modules/acorn/dist/acorn.mjs';
          const root='/tmp/yilbay091';
          const m=JSON.parse(fs.readFileSync(root+'/cells/micro-cell-manifest.json','utf8'));
          if(m.protocol!=='micro-cell-v2-ast'||m.version!=='0.9.1') throw new Error('manifest protocol/version');
          if(m.counts.frontend<83) throw new Error('frontend cells missing: '+m.counts.frontend);
          if(m.counts.backend<42) throw new Error('normalization backend cell missing: '+m.counts.backend);
          for(const entry of [...m.frontend,...m.backend]){
            const src=fs.readFileSync(root+'/'+entry.file,'utf8');
            const ast=parse(src,{ecmaVersion:'latest',sourceType:'script'});
            if(ast.body.length!==1) throw new Error(entry.file+' has '+ast.body.length+' top-level nodes');
            if(ast.body[0].type!==entry.nodeType) throw new Error(entry.file+' node type mismatch');
          }
          const f=m.frontend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          const b=m.backend.map(x=>fs.readFileSync(root+'/'+x.file,'utf8')).join('');
          if(f!==fs.readFileSync(root+'/app/public/app.js','utf8')) throw new Error('frontend bundle mismatch');
          if(b!==fs.readFileSync(root+'/app/server.js','utf8')) throw new Error('backend bundle mismatch');
          const norm=m.backend.find(x=>x.name==='normalizeCourseName');
          const meta=m.backend.find(x=>x.name==='driveMetadataFromFile');
          if(!norm||!meta) throw new Error('normalization/metadata cells missing');
          const ctx={};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(root+'/'+norm.file,'utf8'),ctx);
          vm.runInContext(fs.readFileSync(root+'/'+meta.file,'utf8'),ctx);
          const cases={LgsMatematik:'LGS Matematik','lgs matematik':'LGS Matematik',TYTMatematik:'TYT Matematik','ayt-matematik':'AYT Matematik',Problemler:'Problemler'};
          for(const [input,want] of Object.entries(cases)){const got=ctx.normalizeCourseName(input);if(got!==want)throw new Error(`${input} => ${got}, wanted ${want}`)}
          const md=ctx.driveMetadataFromFile({name:'LgsMatematik__Mutlak Değer__Orta__Mutlak Değer Test 01.pdf'});
          if(md.course!=='LGS Matematik'||md.topic!=='Mutlak Değer'||md.level!=='Orta'||!md.matched) throw new Error('Drive metadata normalization failed: '+JSON.stringify(md));
          console.log('STRICT MICRO CELLS',m.counts,'NORMALIZATION OK');
          NODE
          while IFS= read -r f; do node --check "/tmp/yilbay091/$f"; done < <(node -e "const m=require('/tmp/yilbay091/cells/micro-cell-manifest.json'); console.log([...m.frontend,...m.backend].map(x=>x.file).join('\\n'))")
          node --check /tmp/yilbay091/app/public/app.js
          node --check /tmp/yilbay091/app/server.js
          node /tmp/yilbay091/app/tests.js
          ! grep -qi 'powershell.exe' /tmp/yilbay091/app/server.js
          grep -q 'drive.readonly' /tmp/yilbay091/app/server.js
          grep -q '/api/drive/index' /tmp/yilbay091/app/server.js

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 node /tmp/yilbay091/app/server.js >/tmp/v091_server.log 2>/tmp/v091_server.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/v091_health.json -w '%{http_code}' http://127.0.0.1:43127/health || true)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 0.5
          done
          cat /tmp/v091_health.json || true
          cat /tmp/v091_server.err || true
          test "$OK" = "1"
          grep -q '"version":"0.9.1"' /tmp/v091_health.json
          curl -fsS http://127.0.0.1:43127/api/drive/status >/tmp/v091_drive.json
          grep -q '"configured":false' /tmp/v091_drive.json
          CODE=$(curl -sS -o /tmp/v091_drive_start.json -w '%{http_code}' -X POST http://127.0.0.1:43127/api/drive/oauth/start)
          test "$CODE" = "400"
          grep -q 'OAuth Client ID/Secret' /tmp/v091_drive_start.json
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          trap - EXIT

      - name: Build verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.9.1.zip
          (cd /tmp/yilbay091 && zip -qr "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.9.1.zip" .)
          SHA=$(sha256sum release/YILBAY_APP_v0.9.1.zip | awk '{print $1}')
          cat > release/latest.json <<JSON
          {
            "version": "0.9.1",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.9.1.zip",
            "sha256": "$SHA"
          }
          JSON
          rm -rf source/current
          cp -a /tmp/yilbay091 source/current

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.9.1.zip release/latest.json source/current
          git commit -m 'Publish verified v0.9.1 course normalization [skip ci]'
          git push origin main
