name: Inspect Cloudflare Release Bundle

on:
  push:
    branches:
      - cloudflare-release
    paths:
      - "cloudflare/bundle-inspect-trigger.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Expand release bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/genesis-release-package
          mkdir -p /tmp/genesis-release-package
          cat cloudflare/package-bundle.part1.b64 cloudflare/package-bundle.part2.b64 | base64 -d | tar -xJ -C /tmp/genesis-release-package
          find /tmp/genesis-release-package -maxdepth 3 -type f -print | sort
      - name: Upload decoded package
        uses: actions/upload-artifact@v4
        with:
          name: genesis-release-package-decoded
          path: /tmp/genesis-release-package/
          if-no-files-found: error
          retention-days: 1
