name: GENESIS Container Lifecycle Logs Audit

on:
  push:
    branches: [cloudflare-release]
    paths:
      - "cloudflare/container-lifecycle-logs-audit-trigger.txt"
  workflow_dispatch:
    inputs:
      from_utc:
        description: Inclusive UTC start time (ISO 8601)
        required: true
        default: "2026-09-29T18:43:00Z"
      to_utc:
        description: Exclusive UTC end time (ISO 8601)
        required: true
        default: "2026-09-29T18:50:00Z"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query narrowly scoped Worker observability events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM_UTC: ${{ inputs.from_utc || '2026-09-29T18:43:00Z' }}
          TO_UTC: ${{ inputs.to_utc || '2026-09-29T18:50:00Z' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json, os
          from datetime import datetime

          def millis(value):
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise SystemExit("timestamps must include a UTC offset")
              return int(parsed.timestamp() * 1000)

          start = millis(os.environ["FROM_UTC"])
          end = millis(os.environ["TO_UTC"])
          if end <= start:
              raise SystemExit("to_utc must be later than from_utc")
          payload = {
              "queryId": "genesis-container-lifecycle-audit",
              "timeframe": {"from": start, "to": end},
              "datasets": ["cloudflare-workers"],
              "view": "events",
              "filterCombination": "and",
              "filters": [{
                  "key": "$metadata.service",
                  "operation": "eq",
                  "type": "string",
                  "value": "genesis-web-0152",
              }],
              "limit": 200,
              "dry": True,
          }
          with open("/tmp/genesis-observability-query.json", "w") as f:
              json.dump(payload, f)
          PY
          HTTP="$(curl -sS --connect-timeout 5 --max-time 45 \
            -o /tmp/genesis-observability-result.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/genesis-observability-query.json)"
          echo "Cloudflare observability query HTTP $HTTP"
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          result = json.loads(Path("/tmp/genesis-observability-result.json").read_text())
          if not result.get("success"):
              messages = [x.get("message", "") for x in result.get("errors", [])]
              print("QUERY_FAILED", " | ".join(messages)[:800])
              raise SystemExit(1)
          data = result.get("result") or {}
          events = data.get("events") or data.get("logs") or []
          print("EVENT_COUNT", len(events))

          def redact(value):
              value = re.sub(r"(?i)\b(authorization|bearer|access[_-]?key|secret|password|token)\b\s*[:=]?\s*[^,\s\]\[{}]+", r"\1=<redacted>", value)
              value = re.sub(r"https?://[^\s?]+\?[^\s]+", "<url-with-query-redacted>", value)
              value = re.sub(r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b", "<email-redacted>", value, flags=re.I)
              return value[:1000]

          for event in events:
              metadata = event.get("$metadata") or {}
              worker = event.get("$workers") or {}
              containers = event.get("$containers") or {}
              message = str(metadata.get("message") or metadata.get("error") or "")
              if not message:
                  continue
              if not re.search(r"container|start|error|failed|traceback|uvicorn|sqlite|r2", message, re.I):
                  continue
              print(json.dumps({
                  "timestamp": metadata.get("timestamp"),
                  "script": worker.get("scriptName") or metadata.get("service"),
                  "message": redact(message),
                  "container": containers,
              }, ensure_ascii=False))
          PY
