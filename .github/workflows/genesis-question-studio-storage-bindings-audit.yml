name: GENESIS Question Studio Storage Bindings Audit

on:
  push:
    branches: [cloudflare-release]
    paths:
      - "cloudflare/storage-bindings-audit-trigger.txt"

permissions:
  contents: read

env:
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_SCRIPT_NAME: genesis-web-0152
  CF_CONTAINER_APP_ID: a03b84d1-3560-43de-8d60-55bbca682961

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read sanitized production bindings and health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/settings" -H "$AUTH" -o /tmp/settings.json
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/content/v2" -H "$AUTH" -o /tmp/worker-content.bin
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/worker-content.bin').read_bytes()
          boundary=raw.splitlines()[0].strip()
          for part in raw.split(boundary)[1:]:
              part=part.strip(b'\r\n-')
              if not part:
                  continue
              sep=b'\r\n\r\n' if b'\r\n\r\n' in part else b'\n\n'
              if sep not in part:
                  continue
              _,payload=part.split(sep,1)
              text=payload.decode('utf-8','ignore')
              if 'GenesisContainer' in text and 'GENESIS_CONTAINER' in text:
                  print('WORKER_HAS_ENVVARS=', 'envVars' in text)
                  for key in ('R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ACCOUNT_ID','R2_BUCKET_NAME','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY'):
                      print('WORKER_HAS_'+key+'=', key in text)
              if 'class GenesisContainer' in text:
                  start=text.find('class GenesisContainer')
                  end=text.find('export default',start)
                  if end<0: end=min(len(text),start+5000)
                  snippet=text[start:end]
                  # Only structure / binding names; never print secret values.
                  print('WORKER_HAS_ENVVARS=', 'envVars' in text)
                  for key in ('R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ACCOUNT_ID','R2_BUCKET_NAME','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY'):
                      print('WORKER_HAS_'+key+'=', key in text)
                  compact=' '.join(snippet.split())
                  print('WORKER_CLASS_SNIPPET=',compact[:3000])
                  break
          PY
          echo "BINDINGS="
          jq -c '[.result.bindings[]? | {name,type,class_name,bucket_name}]' /tmp/settings.json

          npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/container.json
          jq '{version,image:.configuration.image,health,observability}' /tmp/container.json

          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          ROOT="$(curl -sS -L --connect-timeout 5 --max-time 15 -o /tmp/root.out -w '%{http_code}' "$URL/" || true)"
          echo "ROOT_HTTP=$ROOT"
          printf 'ROOT_BODY='; head -c 800 /tmp/root.out 2>/dev/null || true; echo

          R2P="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/r2.json -w '%{http_code}' "$URL/api/internal/r2-question-pool-readonly" || true)"
          echo "R2_PROBE_HTTP=$R2P"
          cat /tmp/r2.json 2>/dev/null || true
