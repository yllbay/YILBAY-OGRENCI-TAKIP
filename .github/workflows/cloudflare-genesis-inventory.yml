name: Cloudflare GENESIS Inventory

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/inventory-trigger.txt"

permissions:
  contents: read

env:
  CF_SCRIPT_NAME: genesis-web-0152
  CF_API_BASE: https://api.cloudflare.com/client/v4

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret eksik"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret eksik"; exit 11; }

      - name: Read current Worker inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cf-inventory
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME" -H "$AUTH" -o /tmp/cf-inventory/script.json
          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/settings" -H "$AUTH" -o /tmp/cf-inventory/settings.json
          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/deployments" -H "$AUTH" -o /tmp/cf-inventory/deployments.json
          curl -fsS "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/content/v2" -H "$AUTH" -o /tmp/cf-inventory/worker-content.bin
          sha256sum /tmp/cf-inventory/worker-content.bin | awk '{print $1}' > /tmp/cf-inventory/worker-content.sha256

      - name: Produce sanitized inventory
        run: |
          set -euo pipefail
          jq '{success,result:{id:.result.id,created_on:.result.created_on,modified_on:.result.modified_on,compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags,usage_model:.result.usage_model,etag:.result.etag}}' /tmp/cf-inventory/script.json > /tmp/cf-inventory/script.safe.json
          jq '{success,result:{compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags,main_module:.result.main_module,usage_model:.result.usage_model,placement:.result.placement,limits:.result.limits,observability:.result.observability,migration_tag:.result.migration_tag,bindings:[.result.bindings[]?|{name,type,class_name,service,environment,bucket_name,database_name,namespace_id}]}}' /tmp/cf-inventory/settings.json > /tmp/cf-inventory/settings.safe.json
          jq '{success,deployments:[.result.deployments[]?|{id,created_on,source,strategy,versions}]}' /tmp/cf-inventory/deployments.json > /tmp/cf-inventory/deployments.safe.json
          echo "### Cloudflare production inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: $CF_SCRIPT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker content SHA256: $(cat /tmp/cf-inventory/worker-content.sha256)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cf-inventory/settings.safe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-inventory
          path: |
            /tmp/cf-inventory/script.safe.json
            /tmp/cf-inventory/settings.safe.json
            /tmp/cf-inventory/deployments.safe.json
            /tmp/cf-inventory/worker-content.sha256
          retention-days: 7
