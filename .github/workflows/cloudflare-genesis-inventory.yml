name: Cloudflare GENESIS Inventory

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/inventory-trigger.txt"
      - ".github/workflows/cloudflare-genesis-inventory.yml"

permissions:
  contents: read

env:
  CF_SCRIPT_NAME: genesis-web-0152
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_CONTAINER_APP_ID: a03b84d1-3560-43de-8d60-55bbca682961

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify configured secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret eksik"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret eksik"; exit 11; }
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test "${#ACCOUNT_ID}" -eq 32 || { echo "::error::CLOUDFLARE_ACCOUNT_ID formatı geçersiz"; exit 12; }
          printf '%s' "$ACCOUNT_ID" | grep -Eq '^[0-9A-Fa-f]{32}$' || { echo "::error::CLOUDFLARE_ACCOUNT_ID formatı geçersiz"; exit 13; }

      - name: Read Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cf-inventory
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$CF_API_BASE/user/tokens/verify" -H "$AUTH" -o /tmp/cf-inventory/token.json
          jq -e '.success == true and .result.status == "active"' /tmp/cf-inventory/token.json >/dev/null
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts" -H "$AUTH" -o /tmp/cf-inventory/scripts.json
          jq -e --arg name "$CF_SCRIPT_NAME" '.result[]? | select(.id == $name)' /tmp/cf-inventory/scripts.json >/dev/null
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/settings" -H "$AUTH" -o /tmp/cf-inventory/settings.json
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/script-settings" -H "$AUTH" -o /tmp/cf-inventory/script-settings.json
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/deployments" -H "$AUTH" -o /tmp/cf-inventory/deployments.json
          VERSION_ID="$(jq -r '.result.deployments[0].versions[0].version_id // empty' /tmp/cf-inventory/deployments.json)"
          test -n "$VERSION_ID" || { echo "::error::Aktif Worker version ID bulunamadı"; exit 20; }
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/workers/$CF_SCRIPT_NAME/versions/$VERSION_ID" -H "$AUTH" -o /tmp/cf-inventory/version.json
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/$CF_SCRIPT_NAME/content/v2" -H "$AUTH" -o /tmp/cf-inventory/worker-content.bin
          sha256sum /tmp/cf-inventory/worker-content.bin | awk '{print $1}' > /tmp/cf-inventory/worker-content.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read container metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 containers list > /tmp/cf-inventory/containers-list.txt
          npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/cf-inventory/container-info.json
          npx --yes wrangler@4 containers images list --json > /tmp/cf-inventory/container-images.json

      - name: Inspect current image safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          IMAGE="$(jq -r '.configuration.image' /tmp/cf-inventory/container-info.json)"
          curl -fsS -X POST "$CF_API_BASE/accounts/$ACCOUNT_ID/containers/registries/registry.cloudflare.com/credentials" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"expiration_minutes":5,"permissions":["pull"]}' \
            -o /tmp/cf-inventory/registry-creds.json
          REG_USER="$(jq -r '.result.username // empty' /tmp/cf-inventory/registry-creds.json)"
          REG_PASS="$(jq -r '.result.password // empty' /tmp/cf-inventory/registry-creds.json)"
          test -n "$REG_USER" && test -n "$REG_PASS" || { echo "::error::Registry pull credentials alınamadı"; exit 30; }
          printf '%s' "$REG_PASS" | docker login registry.cloudflare.com -u "$REG_USER" --password-stdin >/dev/null 2>&1
          docker pull "$IMAGE" >/dev/null
          docker image inspect "$IMAGE" | jq '.[0] | {architecture:.Architecture,os:.Os,config:{working_dir:.Config.WorkingDir,entrypoint:.Config.Entrypoint,cmd:.Config.Cmd,exposed_ports:(.Config.ExposedPorts // {} | keys)}}' > /tmp/cf-inventory/image-inspect.safe.json
          CID="$(docker create "$IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true; docker logout registry.cloudflare.com >/dev/null 2>&1 || true' EXIT
          docker export "$CID" -o /tmp/cf-inventory/imagefs.tar
          tar -tf /tmp/cf-inventory/imagefs.tar | grep -E '(^|/)(server\.js|app\.js|index\.html|styles\.css|package\.json|package-lock\.json|entrypoint[^/]*|start[^/]*|rclone[^/]*|.*fuse[^/]*)$' | head -200 > /tmp/cf-inventory/image-paths.safe.txt || true
          : > /tmp/cf-inventory/live-file-hashes.safe.txt
          for target in server.js app.js index.html styles.css; do
            P="$(tar -tf /tmp/cf-inventory/imagefs.tar | grep -E "(^|/)$target$" | head -1 || true)"
            if [ -n "$P" ]; then
              tar -xOf /tmp/cf-inventory/imagefs.tar "$P" | sha256sum | awk -v p="$P" '{print p" "$1}' >> /tmp/cf-inventory/live-file-hashes.safe.txt
            fi
          done

      - name: Summarize live application structure safely
        run: |
          set -euo pipefail
          tar -tf /tmp/cf-inventory/imagefs.tar | grep '^app/APP/' | head -1500 > /tmp/cf-inventory/app-tree.safe.txt || true
          python3 - <<'PY'
          import ast, io, json, re, tarfile
          from pathlib import Path
          out=[]
          with tarfile.open('/tmp/cf-inventory/imagefs.tar','r:') as tf:
              for m in tf.getmembers():
                  if not (m.isfile() and m.name.startswith('app/APP/') and m.name.endswith('.py')):
                      continue
                  f=tf.extractfile(m)
                  if not f:
                      continue
                  src=f.read().decode('utf-8','ignore')
                  row={'file':m.name,'imports':[],'functions':[],'function_details':[],'classes':[],'routes':[]}
                  try:
                      tree=ast.parse(src)
                  except Exception:
                      out.append(row); continue
                  for n in ast.walk(tree):
                      if isinstance(n,(ast.Import,ast.ImportFrom)):
                          if isinstance(n,ast.Import):
                              row['imports'] += [a.name for a in n.names]
                          elif n.module:
                              row['imports'].append(n.module)
                      elif isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                          row['functions'].append(n.name)
                          args=[a.arg for a in (list(n.args.posonlyargs)+list(n.args.args)+list(n.args.kwonlyargs))]
                          calls=[]
                          for q in ast.walk(n):
                              if isinstance(q,ast.Call):
                                  fn=q.func
                                  if isinstance(fn,ast.Name):
                                      calls.append(fn.id)
                                  elif isinstance(fn,ast.Attribute):
                                      parts=[]
                                      cur=fn
                                      while isinstance(cur,ast.Attribute):
                                          parts.append(cur.attr); cur=cur.value
                                      if isinstance(cur,ast.Name):
                                          parts.append(cur.id)
                                      calls.append('.'.join(reversed(parts)))
                          defaults=[]
                          pos_args=list(n.args.posonlyargs)+list(n.args.args)
                          pad=[None]*(len(pos_args)-len(n.args.defaults))+list(n.args.defaults)
                          for a,d in zip(pos_args,pad):
                              if d is None:
                                  defaults.append({'arg':a.arg,'default':None})
                              elif isinstance(d,ast.Call) and isinstance(d.func,ast.Name):
                                  defaults.append({'arg':a.arg,'default_call':d.func.id})
                              elif isinstance(d,ast.Call) and isinstance(d.func,ast.Attribute):
                                  defaults.append({'arg':a.arg,'default_call':d.func.attr})
                              elif isinstance(d,ast.Constant):
                                  defaults.append({'arg':a.arg,'default':d.value})
                          constants=sorted(set(x.value for x in ast.walk(n) if isinstance(x,ast.Constant) and isinstance(x.value,str) and len(x.value)<=200))
                          row['function_details'].append({'name':n.name,'args':args,'defaults':defaults,'calls':sorted(set(calls))[:120],'string_constants':constants[:120]})
                          for d in n.decorator_list:
                              if isinstance(d,ast.Call) and isinstance(d.func,ast.Attribute) and d.args:
                                  method=d.func.attr.lower()
                                  if method in {'get','post','put','patch','delete','api_route'} and isinstance(d.args[0],ast.Constant) and isinstance(d.args[0].value,str):
                                      row['routes'].append({'method':method.upper(),'path':d.args[0].value,'function':n.name})
                      elif isinstance(n,ast.ClassDef):
                          row['classes'].append(n.name)
                  row['imports']=sorted(set(row['imports']))[:100]
                  row['functions']=sorted(set(row['functions']))[:200]
                  row['function_details']=sorted(row['function_details'],key=lambda x:x['name'])[:250]
                  row['classes']=sorted(set(row['classes']))[:100]
                  out.append(row)
          Path('/tmp/cf-inventory/backend-ast.safe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Extract selected production source files
        run: |
          set -euo pipefail
          mkdir -p /tmp/cf-inventory/current-source/backend /tmp/cf-inventory/current-source/frontend
          for p in \
            app/APP/backend/app.py \
            app/APP/backend/auth.py \
            app/APP/backend/coaching_module.py \
            app/APP/frontend/dist/coaching-desk.html \
            app/APP/frontend/dist/coaching-desk.js \
            app/APP/frontend/dist/index.html
          do
            test -n "$(tar -tf /tmp/cf-inventory/imagefs.tar | grep -Fx "$p")" || { echo "::error::Eksik production dosyası: $p"; exit 41; }
            case "$p" in
              app/APP/backend/*) out="/tmp/cf-inventory/current-source/backend/$(basename "$p")" ;;
              *) out="/tmp/cf-inventory/current-source/frontend/$(basename "$p")" ;;
            esac
            tar -xOf /tmp/cf-inventory/imagefs.tar "$p" > "$out"
          done

      - name: Analyze Worker wrapper safely
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          raw=Path('/tmp/cf-inventory/worker-content.bin').read_bytes()
          txt=raw.decode('utf-8','ignore')
          terms=['role','admin','coach','student','teacher','login','session','cookie','authorization','x-genesis','jwt']
          flags={t: bool(re.search(re.escape(t),txt,re.I)) for t in terms}
          headers=sorted(set(re.findall(r'headers?\.(?:get|set|append)\(\s*["\']([^"\']+)["\']',txt,re.I)))
          paths=sorted(set(re.findall(r'["\'](/(?:api|coaching|login|logout)[A-Za-z0-9_./:-]*)["\']',txt)))[:100]
          out={'keyword_presence':flags,'header_names':headers[:100],'route_literals':paths,'sha256':hashlib.sha256(raw).hexdigest()}
          Path('/tmp/cf-inventory/wrapper-analysis.safe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Audit production HTTP surface
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          mkdir -p /tmp/cf-inventory/http-audit
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          base="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          out={"probes":[],"static_assets":[],"js_syntax":[]}

          def fetch(path, method="GET"):
              body=Path("/tmp/cf-inventory/http-audit/body.tmp")
              cmd=["curl","-sS","-L","-X",method,"-o",str(body),"-w","%{http_code}",base+path]
              p=subprocess.run(cmd,text=True,capture_output=True)
              code=int(p.stdout.strip() or 0) if p.returncode==0 else 0
              text=body.read_text(errors="ignore")[:500] if body.exists() else ""
              return code,text

          probes=[
            ("/","public-shell"),
            ("/api/system/health","public-health"),
            ("/api/auth/setup-status","public-auth"),
            ("/api/auth/me","public-auth"),
            ("/coaching","protected-teacher"),
            ("/coaching/desk","protected-teacher"),
            ("/api/coaching/v2/students","protected-api"),
            ("/api/coaching/curriculum/tree","protected-api"),
            ("/coaching/student/genesis-audit-invalid-token","public-student-page"),
            ("/api/coaching/public/genesis-audit-invalid-token/identity","public-student-api"),
            ("/api/coaching/public/genesis-audit-invalid-token/dashboard","public-student-api"),
            ("/api/coaching/public/genesis-audit-invalid-token/goals","public-student-api"),
            ("/api/coaching/public/genesis-audit-invalid-token/learning","public-student-api"),
            ("/api/coaching/public/genesis-audit-invalid-token/insights","public-student-api"),
            ("/online/genesis-audit-invalid-token","public-online-page"),
            ("/api/online/public/genesis-audit-invalid-token/meta","public-online-api"),
            ("/api/online/public/genesis-audit-invalid-token/page/1","public-online-api"),
            ("/api/online/session/genesis-audit-invalid-token","public-online-session"),
            ("/api/online/internet-test/genesis-audit-invalid-token","public-online-api"),
          ]
          for path,kind in probes:
              code,text=fetch(path)
              out["probes"].append({"path":path,"kind":kind,"status":code,"body_prefix":text.replace("\n"," ")[:240]})

          root_code,root_text=fetch("/")
          refs=sorted(set(re.findall(r'''(?:src|href)=["']([^"']+)["']''',root_text)))
          critical=[
            "/static/genesis-auth-gate.js",
            "/static/app-0.10.7.js",
            "/static/genesis-online-01.js",
            "/static/coaching-v2.html",
            "/static/coaching-v2.js",
            "/static/coaching-student.html",
            "/static/coaching-student.js",
            "/static/coaching-desk.html",
            "/static/coaching-desk.js",
            "/static/coaching-goals.html",
            "/static/coaching-goals.js",
            "/static/coaching-goals-public.js",
            "/static/coaching-learning.html",
            "/static/coaching-learning.js",
            "/static/coaching-learning-teacher.js",
            "/static/coaching-insights.js",
            "/static/coaching-ops.js",
            "/static/coaching-curriculum.html",
            "/static/coaching-curriculum.js",
            "/static/online-student.html",
            "/static/online-student.js",
          ]
          refs=sorted(set([x.split("?",1)[0] for x in refs if x.startswith("/static/")]+critical))
          for i,path in enumerate(refs):
              code,text=fetch(path)
              row={"path":path,"status":code}
              out["static_assets"].append(row)
              if path.endswith(".js") and code==200:
                  dst=Path(f"/tmp/cf-inventory/http-audit/js-{i}.js")
                  subprocess.run(["curl","-fsSL",base+path,"-o",str(dst)],check=True)
                  ck=subprocess.run(["node","--check",str(dst)],text=True,capture_output=True)
                  out["js_syntax"].append({"path":path,"ok":ck.returncode==0,"error":ck.stderr[:300]})
          Path("/tmp/cf-inventory/production-http-audit.safe.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          bad_assets=[x for x in out["static_assets"] if x["status"]!=200]
          bad_js=[x for x in out["js_syntax"] if not x["ok"]]
          blocked_public=[x for x in out["probes"] if x["kind"].startswith("public-") and x["path"] not in ("/","/api/system/health","/api/auth/setup-status","/api/auth/me") and x["status"] in (401,403)]
          print(json.dumps({"bad_assets":bad_assets,"bad_js":bad_js,"blocked_public_routes":blocked_public},ensure_ascii=False,indent=2))
          if bad_assets or bad_js:
              raise SystemExit("Static production surface audit failed")
          PY

      - name: Produce sanitized inventory
        run: |
          set -euo pipefail
          jq --arg name "$CF_SCRIPT_NAME" '{success,worker:([.result[]? | select(.id == $name) | {id,created_on,modified_on,compatibility_date,compatibility_flags,usage_model,placement,last_deployed_from}] | first)}' /tmp/cf-inventory/scripts.json > /tmp/cf-inventory/worker.safe.json
          jq '{success,result:{compatibility_date,compatibility_flags,main_module,usage_model,placement,limits,observability,migrations,bindings:[.bindings[]? | {name,type,class_name,service,environment,bucket_name,database_name,namespace_id}]}}' /tmp/cf-inventory/settings.json > /tmp/cf-inventory/settings.safe.json
          jq '{success,result:{logpush,observability,tags,tail_consumers}}' /tmp/cf-inventory/script-settings.json > /tmp/cf-inventory/script-settings.safe.json
          jq '{success,deployments:[.result.deployments[]? | {id,created_on,source,strategy,versions}]}' /tmp/cf-inventory/deployments.json > /tmp/cf-inventory/deployments.safe.json
          jq '{success,result:{id:.result.id,number:.result.number,created_on:.result.created_on,compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags,main_module:.result.main_module,migration_tag:.result.migration_tag,migrations:.result.migrations,containers:.result.containers,exports:.result.exports,bindings:[.result.bindings[]? | {name,type,class_name,script_name,service,environment,bucket_name,database_name,namespace_id}],modules:[.result.modules[]? | {name,content_type}],package_dependencies:.result.package_dependencies,placement:.result.placement}}' /tmp/cf-inventory/version.json > /tmp/cf-inventory/version.safe.json

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-inventory
          path: |
            /tmp/cf-inventory/worker.safe.json
            /tmp/cf-inventory/settings.safe.json
            /tmp/cf-inventory/script-settings.safe.json
            /tmp/cf-inventory/deployments.safe.json
            /tmp/cf-inventory/version.safe.json
            /tmp/cf-inventory/containers-list.txt
            /tmp/cf-inventory/container-info.json
            /tmp/cf-inventory/container-images.json
            /tmp/cf-inventory/image-inspect.safe.json
            /tmp/cf-inventory/image-paths.safe.txt
            /tmp/cf-inventory/live-file-hashes.safe.txt
            /tmp/cf-inventory/app-tree.safe.txt
            /tmp/cf-inventory/backend-ast.safe.json
            /tmp/cf-inventory/wrapper-analysis.safe.json
            /tmp/cf-inventory/production-http-audit.safe.json
            /tmp/cf-inventory/current-source/
            /tmp/cf-inventory/worker-content.bin
            /tmp/cf-inventory/worker-content.sha256
          if-no-files-found: error
          retention-days: 1
