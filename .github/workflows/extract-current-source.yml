name: Extract current app source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-current-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract verified v0.6.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/current /tmp/current
          mkdir -p source/current /tmp/current
          unzip -q release/YILBAY_APP_v0.6.8.zip -d /tmp/current
          cp -a /tmp/current/. source/current/
          test -f source/current/app/server.js
          test -f source/current/app/public/app.js
          node --check source/current/app/server.js
          node --check source/current/app/public/app.js
          node source/current/app/tests.js
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/current
          git commit -m 'Extract current v0.6.8 source for development [skip ci]'
          git push origin main
