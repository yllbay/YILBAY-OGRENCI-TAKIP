name: GENESIS Dashboard HTTP Smoke

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/dashboard-smoke-trigger.txt"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live dashboard buttons and targets
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"

          ROOT_CODE="$(curl -sS -L --max-time 30 -o /tmp/root.html -w '%{http_code}' "$URL/" || true)"
          echo "root HTTP=$ROOT_CODE"
          test "$ROOT_CODE" = "200"

          grep -q 'GENESIS_HOME_DASHBOARD_EDGE_V1' /tmp/root.html || { echo "::error::edge overlay marker missing"; exit 11; }
          grep -q 'Soru Stüdyosu' /tmp/root.html || { echo "::error::Soru Stüdyosu missing"; exit 12; }
          grep -q 'Koçluk Stüdyosu' /tmp/root.html || { echo "::error::Koçluk Stüdyosu missing"; exit 13; }
          grep -q 'Kurum Açma' /tmp/root.html || { echo "::error::Kurum Açma missing"; exit 14; }
          grep -q 'location.assign("/?workspace=1")' /tmp/root.html || { echo "::error::Soru Stüdyosu route missing"; exit 15; }
          grep -q 'location.assign("/coaching")' /tmp/root.html || { echo "::error::Koçluk Stüdyosu route missing"; exit 16; }
          grep -q 'window.genesisCreateInstitution' /tmp/root.html || { echo "::error::Kurum Açma action missing"; exit 17; }

          AUTH_CODE="$(curl -sS -L --max-time 30 -o /tmp/auth.js -w '%{http_code}' "$URL/static/genesis-auth-gate.js" || true)"
          echo "auth asset HTTP=$AUTH_CODE"
          test "$AUTH_CODE" = "200"
          grep -q 'window.genesisCreateInstitution' /tmp/auth.js || { echo "::error::institution form hook missing"; exit 18; }

          WORKSPACE_CODE="$(curl -sS -L --max-time 30 -o /tmp/workspace.html -w '%{http_code}' "$URL/?workspace=1" || true)"
          echo "workspace HTTP=$WORKSPACE_CODE"
          test "$WORKSPACE_CODE" = "200"

          COACH_CODE="$(curl -sS -L --max-time 30 -o /tmp/coaching.html -w '%{http_code}' "$URL/coaching" || true)"
          echo "coaching HTTP=$COACH_CODE"
          test "$COACH_CODE" = "200"

          echo "GENESIS dashboard edge navigation smoke OK"
