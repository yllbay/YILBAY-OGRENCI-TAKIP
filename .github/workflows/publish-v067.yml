name: Publish v0.6.7 Node bootstrap migration

on:
  push:
    branches: [main]
    paths:
      - 'release_build/v0.6.7/**'
      - '.github/workflows/publish-v067.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract stable v0.6.5 base
        run: |
          set -euo pipefail
          rm -rf /tmp/yilbay067 && mkdir -p /tmp/yilbay067/src
          unzip -q release/YILBAY_APP_v0.6.5.zip -d /tmp/yilbay067/src
      - name: Apply Node bootstrap migration
        run: python release_build/v0.6.7/patch_v067.py
      - name: Static validation
        run: |
          set -euo pipefail
          node --check /tmp/yilbay067/src/app/server.js
          node --check /tmp/yilbay067/src/app/public/app.js
          node --check /tmp/yilbay067/src/app/bootstrap/orchestrator_node.js
          node /tmp/yilbay067/src/app/tests.js
          grep -q 'NODE_BOOTSTRAP_MIGRATION_READY' /tmp/yilbay067/src/app/server.js
          grep -q 'node "%~dp0bootstrap' /tmp/yilbay067/src/app/server.js
      - name: Mandatory runtime smoke test
        run: |
          set -euo pipefail
          PORT=43129 node /tmp/yilbay067/src/app/server.js >/tmp/v067.out 2>/tmp/v067.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:43129/health >/tmp/v067.health; then break; fi
            sleep .5
          done
          cat /tmp/v067.health
          grep -q '0.6.7' /tmp/v067.health
      - name: Build ZIP and manifest
        run: |
          set -euo pipefail
          rm -f release/YILBAY_APP_v0.6.7.zip
          cd /tmp/yilbay067/src
          zip -q -r "$GITHUB_WORKSPACE/release/YILBAY_APP_v0.6.7.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -t release/YILBAY_APP_v0.6.7.zip
          SHA="$(sha256sum release/YILBAY_APP_v0.6.7.zip | awk '{print $1}')"
          cat > release/latest.json <<JSON
          {
            "version": "0.6.7",
            "zip_url": "https://raw.githubusercontent.com/yllbay/YILBAY-OGRENCI-TAKIP/main/release/YILBAY_APP_v0.6.7.zip",
            "sha256": "$SHA"
          }
          JSON
      - name: Commit verified release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/YILBAY_APP_v0.6.7.zip release/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified v0.6.7 Node bootstrap migration [skip ci]'
          git push origin main
