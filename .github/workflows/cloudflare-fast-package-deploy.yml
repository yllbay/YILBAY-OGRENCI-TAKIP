name: Fast Cloudflare Package Deploy

on:
  push:
    branches:
      - cloudflare-release
    paths:
      - "cloudflare/release-trigger.txt"

concurrency:
  group: genesis-web-0152-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  CF_API_BASE: https://api.cloudflare.com/client/v4
  CF_CONTAINER_APP_ID: a03b84d1-3560-43de-8d60-55bbca682961

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret eksik"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret eksik"; exit 11; }

      - name: Expand one release bundle
        run: |
          set -euo pipefail
          test -s cloudflare/package-bundle.part1.b64 || { echo "::error::Release bundle part1 eksik"; exit 18; }
          test -s cloudflare/package-bundle.part2.b64 || { echo "::error::Release bundle part2 eksik"; exit 18; }
          rm -rf cloudflare/package-runtime
          mkdir -p cloudflare/package-runtime
          cat cloudflare/package-bundle.part1.b64 cloudflare/package-bundle.part2.b64 | base64 -d | tar -xJ -C cloudflare/package-runtime
          test -f cloudflare/package-runtime/wrangler.jsonc

      - name: Hydrate exact live Worker and base image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          mkdir -p /tmp/genesis-live
          curl -fsS "$CF_API_BASE/accounts/$ACCOUNT_ID/workers/scripts/genesis-web-0152/content/v2" -H "$AUTH" -o /tmp/genesis-live/worker-content.bin
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/genesis-live/worker-content.bin').read_bytes()
          boundary=raw.splitlines()[0].strip()
          candidates=[]
          for part in raw.split(boundary)[1:]:
              part=part.strip(b'\r\n-')
              if not part:
                  continue
              sep=b'\r\n\r\n' if b'\r\n\r\n' in part else b'\n\n'
              if sep not in part:
                  continue
              headers,payload=part.split(sep,1)
              payload=payload.rstrip(b'\r\n')
              if b'GenesisContainer' in payload and b'GENESIS_CONTAINER' in payload:
                  candidates.append(payload)
          if len(candidates) != 1:
              raise SystemExit(f'Beklenen tek GENESIS Worker modülü bulunamadı: {len(candidates)}')
          js=candidates[0]
          if not (b'export' in js and b'container.fetch' in js):
              raise SystemExit('Worker wrapper bütünlük kontrolü başarısız')
          Path('cloudflare/package-runtime/index.js').write_bytes(js)
          PY
          npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/genesis-live/container-info.json
          CURRENT_IMAGE="$(jq -r '.configuration.image // empty' /tmp/genesis-live/container-info.json)"
          CURRENT_VERSION="$(jq -r '.version // 0' /tmp/genesis-live/container-info.json)"
          test -n "$CURRENT_IMAGE" || { echo "::error::Canlı container image bulunamadı"; exit 19; }
          echo "PREVIOUS_CONTAINER_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          python3 - "$CURRENT_IMAGE" <<'PY'
          from pathlib import Path
          import sys
          image=sys.argv[1]
          src=Path('cloudflare/package-runtime/Dockerfile.template').read_text()
          if '__CURRENT_IMAGE__' not in src: raise SystemExit('Dockerfile template placeholder eksik')
          Path('cloudflare/package-runtime/Dockerfile').write_text(src.replace('__CURRENT_IMAGE__',image,1))
          PY

      - name: Add online invalid-token guard hotfix
        run: |
          set -euo pipefail
          cat > cloudflare/package-runtime/patch_online_token.py <<'PY'
          from pathlib import Path
          path=Path('/app/APP/backend/online_exam_module.py')
          src=path.read_text(encoding='utf-8')
          marker='GENESIS_ONLINE_INVALID_TOKEN_GUARD'
          if marker in src:
              raise SystemExit(0)
          needle='        if not re.fullmatch(r"[A-Za-z0-9_-]{8,128}",public_token):\n            raise HTTPException(400,"Sınav bağlantısı geçersiz.")\n'
          replacement=needle+'        # GENESIS_ONLINE_INVALID_TOKEN_GUARD\n        if not online_row_by_token(public_token):\n            raise HTTPException(404,"Online sınav bulunamadı.")\n'
          if needle not in src:
              raise SystemExit('Online internet-test guard patch point bulunamadı')
          path.write_text(src.replace(needle,replacement,1),encoding='utf-8')
          PY
          printf '\nCOPY patch_online_token.py /tmp/patch_online_token.py\nRUN python /tmp/patch_online_token.py && rm -f /tmp/patch_online_token.py\n' >> cloudflare/package-runtime/Dockerfile
      - name: Apply single-admin package patches
        run: |
          set -euo pipefail
          cp cloudflare/single_admin_mode.py cloudflare/package-runtime/single_admin_mode.py
          cp cloudflare/single_admin_ui.py cloudflare/package-runtime/single_admin_ui.py
          printf '\nCOPY single_admin_mode.py /tmp/single_admin_mode.py\nRUN python /tmp/single_admin_mode.py && rm -f /tmp/single_admin_mode.py\nCOPY single_admin_ui.py /tmp/single_admin_ui.py\nRUN python /tmp/single_admin_ui.py && rm -f /tmp/single_admin_ui.py\n' >> cloudflare/package-runtime/Dockerfile
      - name: Apply coaching sidebar independent course copy
        run: |
          set -euo pipefail
          cp cloudflare/coaching_sidebar_coursecopy.py cloudflare/package-runtime/coaching_sidebar_coursecopy.py
          printf '\nCOPY coaching_sidebar_coursecopy.py /tmp/coaching_sidebar_coursecopy.py\nRUN python /tmp/coaching_sidebar_coursecopy.py && rm -f /tmp/coaching_sidebar_coursecopy.py\n' >> cloudflare/package-runtime/Dockerfile
      - name: Fix curriculum desk navigation
        run: |
          set -euo pipefail
          FILE="cloudflare/package-runtime/coaching-curriculum.html"
          test -s "$FILE"
          if grep -q 'href="/coaching-desk"' "$FILE"; then
            sed -i 's|href="/coaching-desk"|href="/coaching/desk"|g' "$FILE"
          fi
          grep -q 'href="/coaching/desk"' "$FILE"
          ! grep -q 'href="/coaching-desk"' "$FILE"

      - name: Validate deployment package
        working-directory: cloudflare/package-runtime
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f Dockerfile.template
          test -f Dockerfile
          test -f index.js
          test -f curriculum_step1.py
          test -f patch_app.py
          test -f patch_online_token.py
          test -f single_admin_mode.py
          test -f single_admin_ui.py
          test -f coaching_sidebar_coursecopy.py
          python -m py_compile curriculum_step1.py patch_app.py patch_online_token.py single_admin_mode.py single_admin_ui.py coaching_sidebar_coursecopy.py
          node --check coaching-curriculum.js
          grep -q 'GenesisContainer = class extends Container' index.js
          grep -q 'GENESIS_COACHING_CURRICULUM_STEP1_START' patch_app.py
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/genesis-wrangler-dry --containers-rollout=none --keep-vars

      - name: Login to Cloudflare Container Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          docker info >/dev/null
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          curl -fsS -X POST "$CF_API_BASE/accounts/$ACCOUNT_ID/containers/registries/registry.cloudflare.com/credentials" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"expiration_minutes":10,"permissions":["pull","push"]}' \
            -o /tmp/registry-creds.json
          REG_USER="$(jq -r '.result.username // empty' /tmp/registry-creds.json)"
          REG_PASS="$(jq -r '.result.password // empty' /tmp/registry-creds.json)"
          test -n "$REG_USER" && test -n "$REG_PASS"
          printf '%s' "$REG_PASS" | docker login registry.cloudflare.com -u "$REG_USER" --password-stdin >/dev/null

      - name: Prebuild patched container safely
        run: |
          set -euo pipefail
          docker build -t genesis-step1-preflight -f cloudflare/package-runtime/Dockerfile cloudflare/package-runtime
          CID="$(docker create genesis-step1-preflight)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/APP/backend/app.py" /tmp/patched-app.py
          docker cp "$CID:/app/APP/backend/curriculum_step1.py" /tmp/patched-curriculum.py
          docker cp "$CID:/app/APP/frontend/dist/coaching-curriculum.html" /tmp/patched-curriculum.html
          docker cp "$CID:/app/APP/backend/online_exam_module.py" /tmp/patched-online-exam.py
          docker cp "$CID:/app/APP/backend/coaching_v2.py" /tmp/patched-coaching-v2.py
          docker cp "$CID:/app/APP/frontend/dist/app-0.10.7.js" /tmp/patched-app-0.10.7.js
          docker cp "$CID:/app/APP/frontend/dist/genesis-online-01.js" /tmp/patched-genesis-online-01.js
          docker cp "$CID:/app/APP/frontend/dist/coaching-v2.html" /tmp/patched-coaching-v2.html
          docker cp "$CID:/app/APP/frontend/dist/coaching-v2.js" /tmp/patched-coaching-v2.js
          docker cp "$CID:/app/APP/frontend/dist/coaching-v2.css" /tmp/patched-coaching-v2.css
          grep -q 'GENESIS_COACHING_CURRICULUM_STEP1_START' /tmp/patched-app.py
          grep -q '/api/coaching/curriculum/tree' /tmp/patched-curriculum.py
          grep -q 'Ders.*Ünite.*Alt Başlık' /tmp/patched-curriculum.html
          grep -q 'href="/coaching/desk"' /tmp/patched-curriculum.html
          ! grep -q 'href="/coaching-desk"' /tmp/patched-curriculum.html
          grep -q 'GENESIS_ONLINE_INVALID_TOKEN_GUARD' /tmp/patched-online-exam.py
          grep -q 'GENESIS_SINGLE_ADMIN_AUTO_SESSION' /tmp/patched-app.py
          grep -q 'GENESIS_SINGLE_ADMIN_ACCOUNT_CLEANUP' /tmp/patched-app.py
          ! grep -q 'Yeni Kurum Oluştur' /tmp/patched-app-0.10.7.js
          ! grep -q 'Kurum Aç' /tmp/patched-genesis-online-01.js
          ! grep -q 'Yönetici Şifresini Değiştir' /tmp/patched-genesis-online-01.js
          grep -q 'GENESIS_COACHING_SIDEBAR_COURSE_COPY_V1' /tmp/patched-coaching-v2.html
          ! grep -q '<span>ÖĞRENCİLER</span>' /tmp/patched-coaching-v2.html
          grep -q 'id="addStudent".*>+ Öğrenci Ekle<' /tmp/patched-coaching-v2.html
          grep -q 'id="addCourseWorkspace".*>+ Ders Ekle<' /tmp/patched-coaching-v2.html
          grep -q 'id="courseWorkspace"' /tmp/patched-coaching-v2.html
          grep -q 'GENESIS_COACHING_COURSE_COPY_V1' /tmp/patched-coaching-v2.js
          grep -q "api('/api/topics')" /tmp/patched-coaching-v2.js
          grep -q "api('/api/test-tree')" /tmp/patched-coaching-v2.js
          grep -q 'GENESIS_COACHING_COURSE_COPY_V1' /tmp/patched-coaching-v2.css
          node --check /tmp/patched-coaching-v2.js
          python -m py_compile /tmp/patched-app.py /tmp/patched-curriculum.py /tmp/patched-online-exam.py /tmp/patched-coaching-v2.py
          node --check /tmp/patched-app-0.10.7.js
          node --check /tmp/patched-genesis-online-01.js
          node --check /tmp/patched-coaching-v2.js
          docker rm -f "$CID" >/dev/null
          trap - EXIT

      - name: Deploy one tested package
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/package-runtime
          command: deploy --keep-vars --containers-rollout=immediate

      - name: Wait for container rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 24); do
            npx --yes wrangler@4 containers info "$CF_CONTAINER_APP_ID" > /tmp/container-info.json
            VERSION="$(jq -r '.version // 0' /tmp/container-info.json)"
            FAILED="$(jq -r '.health.instances.failed // 0' /tmp/container-info.json)"
            ERRORS="$(jq -r '.health.errors | length' /tmp/container-info.json)"
            if [ "$VERSION" -gt "$PREVIOUS_CONTAINER_VERSION" ] && [ "$FAILED" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
              READY=1
              echo "Container rollout accepted: version $VERSION (active instances may be 0 until request)"
              break
            fi
            sleep 5
          done
          test "$READY" = "1" || { echo "::error::Container rollout version did not advance cleanly"; cat /tmp/container-info.json; exit 29; }
          test "$(jq -r '.observability.logs.enabled // false' /tmp/container-info.json)" = "true" || { echo "::error::Container observability logs disabled"; exit 30; }

      - name: Smoke test production and auth guard
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev"
          OK=0
          for i in $(seq 1 18); do
            CODE=$(curl -sS -L -o /tmp/genesis.html -w '%{http_code}' "$URL/" || true)
            if [ "$CODE" = "200" ] && grep -qi "GENESIS" /tmp/genesis.html; then
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = "1" || { echo "::error::Production root smoke test başarısız"; exit 30; }

          ME_CODE=$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/auth-me.json -w '%{http_code}' "$URL/api/auth/me" || true)
          test "$ME_CODE" = "200" || { echo "::error::Single ADMIN auth/me HTTP $ME_CODE"; cat /tmp/auth-me.json; exit 31; }
          jq -e '.authenticated == true and .role == "ADMIN" and .institution_id == null and .must_change_password == false' /tmp/auth-me.json >/dev/null || { echo "::error::Single ADMIN session doğrulanamadı"; cat /tmp/auth-me.json; exit 32; }

          API_CODE=$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/curriculum.json -w '%{http_code}' "$URL/api/coaching/curriculum/tree" || true)
          test "$API_CODE" = "200" || { echo "::error::Curriculum single ADMIN erişimi HTTP $API_CODE"; cat /tmp/curriculum.json; exit 41; }

          USERS_CODE=$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/institutions.json -w '%{http_code}' "$URL/api/admin/institutions" || true)
          test "$USERS_CODE" = "200" || { echo "::error::Institution list HTTP $USERS_CODE"; exit 42; }
          jq -e 'type=="array" and length==0' /tmp/institutions.json >/dev/null || { echo "::error::Diğer kullanıcı hesapları temizlenmemiş"; cat /tmp/institutions.json; exit 43; }

          CREATE_CODE=$(curl -sS -c /tmp/genesis.cookies -b /tmp/genesis.cookies -o /tmp/create-user.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"institution_name":"AUDIT","username":"audit","temporary_password":"12345678"}' "$URL/api/admin/institutions" || true)
          test "$CREATE_CODE" = "410" || { echo "::error::Kurum kullanıcısı oluşturma kapalı değil: HTTP $CREATE_CODE"; cat /tmp/create-user.json; exit 44; }

          STATIC_CODE=$(curl -sS -o /tmp/curriculum.html -w '%{http_code}' "$URL/static/coaching-curriculum.html" || true)
          test "$STATIC_CODE" = "200" || { echo "::error::Curriculum UI HTTP $STATIC_CODE"; exit 33; }
          grep -q 'Ders.*Ünite.*Alt Başlık' /tmp/curriculum.html || { echo "::error::Curriculum UI doğrulanamadı"; exit 34; }
          grep -q 'href="/coaching/desk"' /tmp/curriculum.html || { echo "::error::Curriculum Takip Masası bağlantısı yanlış"; exit 37; }
          ! grep -q 'href="/coaching-desk"' /tmp/curriculum.html || { echo "::error::Eski kırık curriculum desk bağlantısı hâlâ mevcut"; exit 38; }

          COACH_HTML_CODE=$(curl -sS -o /tmp/coaching-v2.html -w '%{http_code}' "$URL/static/coaching-v2.html" || true)
          COACH_JS_CODE=$(curl -sS -o /tmp/coaching-v2.js -w '%{http_code}' "$URL/static/coaching-v2.js" || true)
          COACH_CSS_CODE=$(curl -sS -o /tmp/coaching-v2.css -w '%{http_code}' "$URL/static/coaching-v2.css" || true)
          test "$COACH_HTML_CODE" = "200" && test "$COACH_JS_CODE" = "200" && test "$COACH_CSS_CODE" = "200" || { echo "::error::Koçluk sidebar assetleri erişilemedi"; exit 45; }
          grep -q 'GENESIS_COACHING_SIDEBAR_COURSE_COPY_V1' /tmp/coaching-v2.html || { echo "::error::Koçluk sidebar bağımsız kopya HTML patch doğrulanamadı"; exit 46; }
          ! grep -q '<span>ÖĞRENCİLER</span>' /tmp/coaching-v2.html || { echo "::error::Öğrenciler başlığı hâlâ mevcut"; exit 47; }
          grep -q 'id="addStudent".*>+ Öğrenci Ekle<' /tmp/coaching-v2.html || { echo "::error::Öğrenci Ekle düğmesi bulunamadı"; exit 48; }
          grep -q 'id="addCourseWorkspace".*>+ Ders Ekle<' /tmp/coaching-v2.html || { echo "::error::Ders Ekle düğmesi bulunamadı"; exit 49; }
          grep -q 'id="courseWorkspace"' /tmp/coaching-v2.html || { echo "::error::Bağımsız Ders Ekle çalışma alanı bulunamadı"; exit 50; }
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/coaching-v2.html').read_text(encoding='utf-8')
          assert s.index('id="studentSearch"') < s.index('id="addStudent"') < s.index('id="addCourseWorkspace"') < s.index('id="studentList"')
          PY
          grep -q 'GENESIS_COACHING_COURSE_COPY_V1' /tmp/coaching-v2.js || { echo "::error::Koçluk bağımsız kopya JS doğrulanamadı"; exit 51; }
          grep -q "api('/api/topics')" /tmp/coaching-v2.js || { echo "::error::Bağımsız Konular GET bağlantısı yok"; exit 52; }
          grep -q "api('/api/test-tree')" /tmp/coaching-v2.js || { echo "::error::Bağımsız Testler GET bağlantısı yok"; exit 53; }
          grep -q '/api/questions?topic_id=' /tmp/coaching-v2.js || { echo "::error::Bağımsız soru GET bağlantısı yok"; exit 54; }
          grep -q 'GENESIS_COACHING_COURSE_COPY_V1' /tmp/coaching-v2.css || { echo "::error::Koçluk bağımsız kopya CSS doğrulanamadı"; exit 55; }
          node --check /tmp/coaching-v2.js

          ONLINE_CODE=$(curl -sS -o /tmp/online-invalid.json -w '%{http_code}' "$URL/api/online/internet-test/genesis-audit-invalid-token" || true)
          test "$ONLINE_CODE" = "404" || { echo "::error::Invalid online token beklenen 404 yerine HTTP $ONLINE_CODE"; cat /tmp/online-invalid.json; exit 35; }
          grep -q 'Online sınav bulunamadı' /tmp/online-invalid.json || { echo "::error::Invalid online token mesajı doğrulanamadı"; exit 36; }

          echo "GENESIS release smoke tests OK"

      - name: Record release status
        if: always()
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("cloudflare/last-release-status.json").write_text(json.dumps({
            "status": os.environ["RELEASE_JOB_STATUS"],
            "sha": os.environ["RELEASE_SHA"],
            "run_id": int(os.environ["RELEASE_RUN_ID"])
          }, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/last-release-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(cloudflare): record release status"
          git push origin HEAD:cloudflare-release
