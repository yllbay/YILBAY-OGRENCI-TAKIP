name: Fast Cloudflare Package Deploy

on:
  push:
    branches:
      - cloudflare-release
    paths:
      - "cloudflare/package/**"
      - ".github/workflows/cloudflare-fast-package-deploy.yml"

concurrency:
  group: genesis-web-0152-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret eksik"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret eksik"; exit 11; }

      - name: Validate deployment package
        run: |
          set -euo pipefail
          test -d cloudflare/package || { echo "::error::cloudflare/package bulunamadı"; exit 20; }
          if [ ! -f cloudflare/package/wrangler.jsonc ] && [ ! -f cloudflare/package/wrangler.toml ]; then
            echo "::error::Wrangler production config bulunamadı"
            exit 21
          fi
          if [ -f cloudflare/package/verify.sh ]; then
            bash cloudflare/package/verify.sh
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/package
          command: deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="https://genesis-web-0152.yilbayonurcelik.workers.dev/"
          OK=0
          for i in $(seq 1 12); do
            CODE=$(curl -sS -L -o /tmp/genesis.html -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && grep -qi "GENESIS" /tmp/genesis.html; then
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = "1" || { echo "::error::Production smoke test başarısız"; exit 30; }
          echo "GENESIS production smoke test OK"
